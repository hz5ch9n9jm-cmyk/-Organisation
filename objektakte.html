<title>Objektakte</title>
<meta name="description" content="Immobilien bewerten: Kaufnebenkosten, Finanzierung, Steuern, Cashflow, Rendite, Stresstest, Prognose und Objekt-Check mit Ampel-Urteil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: Feldbuch-App wie das Lagezentrum, max. 760px, Tab-Leiste unten; Akte je Objekt mit Urteil vor den Details. */
:root {
  --bg: #eceee6;
  --surface: #f8f9f4;
  --sunk: #e2e5da;
  --ink: #1c2119;
  --muted: #5a6155;
  --line: #d0d4c6;
  --accent: #2e3a2a;
  --accent-fg: #f2f4ec;
  --copper: #a85620;
  --copper-soft: rgba(168, 86, 32, .16);
  --violet: #4a3aa7;
  --bar-neg: #868c7c;
  --grid: #e1e4d9;
  --axis: #b9beae;
  --ok: #2b8547;   --ok-bg: #dcefe1;
  --warn: #b98a00; --warn-bg: #f6ebc4;
  --crit: #c0392b; --crit-bg: #f6dcd8;
  --info: #2b67ad; --info-bg: #dbe6f3;
  --on-status: #ffffff;
  --shadow: 0 1px 0 rgba(28,33,25,.06), 0 6px 18px -10px rgba(28,33,25,.25);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131611; --surface: #1b1f18; --sunk: #232820; --ink: #e7eadf; --muted: #9ba293; --line: #31372d;
    --accent: #cbd5b9; --accent-fg: #151812;
    --copper: #cf7a40; --copper-soft: rgba(207, 122, 64, .2); --violet: #9085e9;
    --bar-neg: #6b7363; --grid: #262b22; --axis: #3d4438;
    --ok: #5cc27b; --ok-bg: rgba(92,194,123,.14);
    --warn: #e6bd3a; --warn-bg: rgba(230,189,58,.14);
    --crit: #ef6b5d; --crit-bg: rgba(239,107,93,.15);
    --info: #6ba6e8; --info-bg: rgba(107,166,232,.15);
    --on-status: #10130e;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131611; --surface: #1b1f18; --sunk: #232820; --ink: #e7eadf; --muted: #9ba293; --line: #31372d;
  --accent: #cbd5b9; --accent-fg: #151812;
  --copper: #cf7a40; --copper-soft: rgba(207, 122, 64, .2); --violet: #9085e9;
  --bar-neg: #6b7363; --grid: #262b22; --axis: #3d4438;
  --ok: #5cc27b; --ok-bg: rgba(92,194,123,.14);
  --warn: #e6bd3a; --warn-bg: rgba(230,189,58,.14);
  --crit: #ef6b5d; --crit-bg: rgba(239,107,93,.15);
  --info: #6ba6e8; --info-bg: rgba(107,166,232,.15);
  --on-status: #10130e;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-inline: 16px; padding-block: 0 calc(92px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 760px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1; hyphens: auto; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-display); font-weight: 600; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.tiny { font-size: .78rem; }
a { color: var(--info); }

/* Kopf */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-size: 1.6rem; text-transform: uppercase; letter-spacing: .06em; }
.dtg { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); letter-spacing: .04em; }
.sync { font-size: .75rem; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
.sync.on i { background: var(--ok); }
@media (max-width: 480px) { .sync span { display: none; } }
.back { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; padding: 6px 4px 6px 0; font-weight: 600; color: var(--info); flex-shrink: 0; }
.obj-title { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.obj-title b { font-family: var(--f-display); font-size: 1.2rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.obj-title span { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.subnav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.subnav::-webkit-scrollbar { display: none; }
.subnav button { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 4px; font-family: var(--f-display); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; font-size: .78rem; color: var(--muted); }
@media (min-width: 560px) { .subnav button { font-size: .84rem; letter-spacing: .05em; } }
.subnav button[aria-current="page"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.livestrip { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.livestrip b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 700; }

main { display: flex; flex-direction: column; gap: 18px; padding-block: 18px; }
section.view { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
section.view > * { min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Chips & Ampel */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; }
.chip.g { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.y { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.r { background: var(--crit-bg); color: var(--crit); border-color: transparent; }
.chip.b { background: var(--info-bg); color: var(--info); border-color: transparent; }
.chip.wrap { white-space: normal; }
.sym { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: .72rem; font-weight: 800; line-height: 1; flex-shrink: 0; color: var(--on-status); background: var(--muted); font-family: var(--f-body); }
.sym.g { background: var(--ok); } .sym.y { background: var(--warn); } .sym.r { background: var(--crit); } .sym.b { background: var(--info); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; padding: 9px 14px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 40px; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--crit); border-color: var(--crit); background: transparent; }
.btn.danger.armed { background: var(--crit); color: var(--on-status); }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: .88rem; }
.btn.link { border: none; background: none; padding: 4px 0; min-height: 0; color: var(--info); font-weight: 600; }
.ibtn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: .72rem; font-weight: 700; font-family: var(--f-mono); padding: 0; display: inline-grid; place-items: center; flex-shrink: 0; vertical-align: middle; }
.ibtn:hover { color: var(--info); border-color: var(--info); }

/* Urteil */
.verdict { border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); border: 1px solid transparent; }
.verdict.g { background: var(--ok-bg); }
.verdict.y { background: var(--warn-bg); }
.verdict.r { background: var(--crit-bg); }
.verdict.n { background: var(--sunk); }
.v-word { overflow-wrap: anywhere; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.9rem, 10vw, 3.2rem); line-height: .95; letter-spacing: .04em; text-transform: uppercase; }
.verdict.g .v-word { color: var(--ok); } .verdict.y .v-word { color: var(--warn); } .verdict.r .v-word { color: var(--crit); }
.v-lead { font-size: 1.02rem; font-weight: 600; max-width: 60ch; }
.pillars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pillars li { display: grid; grid-template-columns: 18px 78px 1fr; gap: 10px; align-items: start; font-size: .94rem; }
.pillars li b { font-weight: 700; }
.pillars li span.t { min-width: 0; overflow-wrap: anywhere; }

/* Kennzahlen */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile .lbl { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: .8rem; color: var(--muted); font-weight: 600; }
.tile .lbl span { min-width: 0; overflow-wrap: break-word; hyphens: auto; }
.tile .val { font-family: var(--f-mono); font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .val.g { color: var(--ok); } .tile .val.y { color: var(--warn); } .tile .val.r { color: var(--crit); }
.tile .thr { font-size: .74rem; color: var(--muted); }

.maxrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; padding-block: 8px; border-top: 1px solid var(--line); }
.maxrow:first-of-type { border-top: none; }
.maxrow .v { font-family: var(--f-mono); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; text-align: right; }
.maxrow .sub { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); }

.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.notes li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; font-size: .92rem; }
.notes li span.t { min-width: 0; overflow-wrap: anywhere; }

/* Wasserfall */
.wf { display: flex; flex-direction: column; gap: 6px; }
.wf-row { display: grid; grid-template-columns: minmax(0, 9.5rem) 1fr 5.6rem; gap: 10px; align-items: center; font-size: .86rem; }
@media (min-width: 560px) { .wf-row { grid-template-columns: 13rem 1fr 6.4rem; } }
.wf-l { min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
.wf-row.sub .wf-l, .wf-row.end .wf-l { font-weight: 700; }
.wf-track { position: relative; height: 18px; }
.wf-zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.wf-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; background: var(--bar-neg); min-width: 2px; }
.wf-bar.pos { background: var(--copper); }
.wf-bar.sub { background: var(--ink); }
.wf-bar.g { background: var(--ok); } .wf-bar.y { background: var(--warn); } .wf-bar.r { background: var(--crit); }
.wf-v { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.wf-row.end { padding-top: 6px; border-top: 1px solid var(--line); }
.wf-ref { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px dashed var(--violet); }

/* Bullet (Vergleichsskala) */
.bullet { display: flex; flex-direction: column; gap: 6px; }
.bullet-track { position: relative; height: 14px; border-radius: 4px; overflow: hidden; display: flex; }
.bullet-track i { display: block; height: 100%; }
.bz-b { background: var(--info-bg); } .bz-g { background: var(--ok-bg); } .bz-y { background: var(--warn-bg); } .bz-r { background: var(--crit-bg); }
.bullet-wrap { position: relative; padding-top: 2px; }
.bullet-mark { position: absolute; top: -3px; width: 4px; height: 20px; margin-left: -2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.bullet-ref { position: absolute; top: 0; height: 16px; width: 0; border-left: 2px dashed var(--muted); }
.bullet-legend { display: flex; justify-content: space-between; gap: 8px; font-size: .76rem; color: var(--muted); flex-wrap: wrap; }

/* Formulare */
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fgrid .full { grid-column: 1 / -1; }
@media (max-width: 360px) { .fgrid { grid-template-columns: 1fr; } }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld .lbl { display: flex; align-items: center; gap: 6px; font-size: .84rem; font-weight: 600; color: var(--muted); min-height: 22px; }
.fld .lbl label { min-width: 0; overflow-wrap: break-word; hyphens: auto; }
.inp { display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-height: 42px; overflow: hidden; }
.inp:focus-within { border-color: var(--info); box-shadow: 0 0 0 2px var(--info-bg); }
.inp input { flex: 1; min-width: 0; border: none; background: transparent; padding: 8px 10px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .98rem; outline: none; }
.inp input.txt { font-family: var(--f-body); }
.inp .u { display: flex; align-items: center; padding: 0 10px; background: var(--sunk); color: var(--muted); font-size: .8rem; font-weight: 600; white-space: nowrap; }
.fld .hint { font-size: .76rem; color: var(--muted); min-height: 1em; }
select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-height: 42px; }
textarea { min-height: 96px; resize: vertical; font-family: var(--f-body); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.switch { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: .92rem; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.sumtable { width: 100%; border-collapse: collapse; font-size: .92rem; }
.sumtable td { padding: 6px 0; border-top: 1px solid var(--line); }
.sumtable tr:first-child td { border-top: none; }
.sumtable td.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 10px; }
.sumtable tr.total td { font-weight: 700; border-top: 2px solid var(--ink); font-size: 1rem; }
.sumtable td .muted { font-size: .8rem; }

/* Tabellen */
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; }
.tscroll.tall { max-height: 380px; overflow-y: auto; }
table.data { border-collapse: collapse; width: 100%; font-size: .86rem; }
table.data th, table.data td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
table.data th:first-child, table.data td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.data thead th { position: sticky; top: 0; background: var(--sunk); font-family: var(--f-display); letter-spacing: .05em; text-transform: uppercase; font-size: .76rem; color: var(--muted); z-index: 2; }
table.data thead th:first-child { z-index: 3; background: var(--sunk); }
table.data td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; background: var(--surface); }
table.data td:first-child { font-family: var(--f-body); font-weight: 600; }
table.data tr.mark td { background: var(--warn-bg); }
table.data tr.mark td:first-child { background: var(--warn-bg); }
table.data td.best { color: var(--ok); font-weight: 700; }

/* Diagramm */
.chart { position: relative; width: 100%; min-height: 240px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.chart text.lab { font-family: var(--f-body); font-size: 12px; font-weight: 600; fill: var(--ink); }
.chart .gridl { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--axis); stroke-width: 1; }
.chart .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .band { fill: var(--copper-soft); stroke: none; }
.chart .l-immo { fill: none; stroke: var(--copper); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .l-etf { fill: none; stroke: var(--violet); stroke-width: 2; stroke-dasharray: 6 4; stroke-linejoin: round; }
.chart .m-immo { fill: var(--copper); stroke: var(--surface); stroke-width: 2; }
.chart .m-etf { fill: var(--violet); stroke: var(--surface); stroke-width: 2; }
.chart .cross { stroke: var(--ink); stroke-width: 1; opacity: .5; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: .8rem; line-height: 1.35; min-width: 150px; box-shadow: var(--shadow); z-index: 4; }
.tip b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tip .tr { display: flex; justify-content: space-between; gap: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-immo { width: 18px; height: 3px; background: var(--copper); border-radius: 2px; }
.lg-band { width: 18px; height: 12px; background: var(--copper-soft); border-radius: 3px; }
.lg-etf { width: 18px; height: 0; border-top: 3px dashed var(--violet); }

/* Liste */
.objcard { display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); color: inherit; }
.objcard:hover { border-color: var(--muted); }
.objcard.dim { opacity: .7; }
.oc-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.oc-top .t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.oc-top .t b { font-family: var(--f-display); font-size: 1.25rem; line-height: 1.1; overflow-wrap: anywhere; }
.oc-top .t span { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
.oc-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.oc-nums .n { display: flex; flex-direction: column; min-width: 0; }
.oc-nums span { font-size: .72rem; color: var(--muted); }
.oc-nums b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .98rem; overflow-wrap: anywhere; }
.ak { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); letter-spacing: .03em; }

/* Check */
.citem { display: grid; grid-template-columns: 1fr; gap: 6px; padding-block: 10px; border-top: 1px solid var(--line); }
.citem:first-child { border-top: none; }
.citem .ct { font-weight: 600; overflow-wrap: anywhere; }
.citem .cd { font-size: .82rem; color: var(--muted); }
.cstate { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cstate button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: .82rem; font-weight: 600; }
.cstate button[aria-pressed="true"].ok { background: var(--ok); border-color: var(--ok); color: var(--on-status); }
.cstate button[aria-pressed="true"].mangel { background: var(--warn); border-color: var(--warn); color: var(--on-status); }
.cstate button[aria-pressed="true"].krit { background: var(--crit); border-color: var(--crit); color: var(--on-status); }

.note { border-radius: 8px; padding: 10px 12px; font-size: .9rem; display: flex; gap: 10px; align-items: flex-start; }

/* Bogen */

@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 16px; } }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<div id="layer" lang="de"></div>

<script>
/* ================= Rechenkern ================= */
const Rechner = (function () {
  "use strict";
  /* Grunderwerbsteuer in %, Stand Oktober 2026 (Bremen 5,5 % seit 1.7.2025) */
  const GREST = { BW: 5, BY: 3.5, BE: 6, BB: 6.5, HB: 5.5, HH: 5.5, HE: 6, MV: 6, NI: 5, NW: 6.5, RP: 5, SL: 6.5, SN: 5.5, ST: 5, SH: 6.5, TH: 5 };
  const LAENDER = { BW: "Baden-Württemberg", BY: "Bayern", BE: "Berlin", BB: "Brandenburg", HB: "Bremen", HH: "Hamburg", HE: "Hessen", MV: "Mecklenburg-Vorpommern", NI: "Niedersachsen", NW: "Nordrhein-Westfalen", RP: "Rheinland-Pfalz", SL: "Saarland", SN: "Sachsen", ST: "Sachsen-Anhalt", SH: "Schleswig-Holstein", TH: "Thüringen" };
  /* § 28 II. BV, Instandhaltung je m² und Jahr ab 1.1.2026: unter 22 J. / ab 22 J. / ab 32 J. */
  const II_BV = [11.50, 14.58, 18.62];
  const SZEN = {
    pess: { dWert: -1.5, dMiete: -1, dZins: 2, dAusfall: 2, dKosten: 0.5 },
    real: {},
    opt: { dWert: 1, dMiete: 0.5, dZins: -0.5, dAusfall: -1 }
  };
  const JAHR = new Date().getFullYear();
  const Y = 50;
  const has = v => typeof v === "number" && isFinite(v);
  const n = v => has(v) ? v : 0;

  function instandRichtwert(o) {
    const alter = JAHR - (n(o.baujahr) > 1700 ? o.baujahr : JAHR);
    const base = alter >= 32 ? II_BV[2] : alter >= 22 ? II_BV[1] : II_BV[0];
    return o.art === "etw" ? Math.round(base * 50) / 100 : base;
  }

  function fehlend(o) {
    const f = [];
    if (!(n(o.preis) > 0)) f.push("Kaufpreis");
    if (!(n(o.miete) > 0)) f.push("Kaltmiete");
    if (!(n(o.flaeche) > 0)) f.push("Wohnfläche");
    if (!(n(o.baujahr) > 1700)) f.push("Baujahr");
    return f;
  }

  function sanierung(o) {
    let s = 0;
    const costs = o.costs || {}, checks = o.checks || {};
    for (const k in costs) {
      const st = checks[k];
      if (k === "sonst" || st === "mangel" || st === "krit") s += n(costs[k]);
    }
    return s;
  }

  /* Annuitätendarlehen, monatlich gerechnet. Nach der Zinsbindung wird die Rate so neu berechnet,
     dass der Kredit zum ursprünglich geplanten Zeitpunkt getilgt ist. */
  function simLoan(L, z, t, bind, az, sonderPct) {
    const out = { zins: [], tilg: [], sonder: [], rate: [], rest: [], restBind: null, payoff: null, rate0: 0, rateNach: null };
    if (!(L > 0)) {
      for (let y = 0; y < Y; y++) { out.zins.push(0); out.tilg.push(0); out.sonder.push(0); out.rate.push(0); out.rest.push(0); }
      out.restBind = 0; out.payoff = 0;
      return out;
    }
    let rest = L, q = z / 1200;
    let pay = L * (z + t) / 1200;
    let nTotal;
    if (t <= 0) nTotal = Infinity;
    else if (q === 0) nTotal = L / pay;
    else nTotal = -Math.log(1 - q * L / pay) / Math.log(1 + q);
    out.rate0 = pay;
    const bindM = Math.round(bind) * 12;
    for (let y = 1; y <= Y; y++) {
      let zs = 0, ts = 0, ss = 0, rs = 0;
      for (let m = 1; m <= 12; m++) {
        const mi = (y - 1) * 12 + m;
        if (bindM > 0 && mi === bindM + 1 && rest > 0.005) {
          q = az / 1200;
          const remaining = nTotal - bindM;
          if (!isFinite(remaining)) pay = rest * q;
          else if (remaining <= 1) pay = rest * (1 + q);
          else pay = q === 0 ? rest / remaining : rest * q / (1 - Math.pow(1 + q, -remaining));
          out.rateNach = pay;
        }
        if (rest <= 0.005) continue;
        const zi = rest * q;
        const tg = Math.max(0, Math.min(rest, pay - zi));
        rest -= tg; zs += zi; ts += tg; rs += zi + tg;
      }
      if (sonderPct > 0 && rest > 0.005) { const s = Math.min(rest, L * sonderPct / 100); rest -= s; ss += s; }
      if (rest < 0.005) rest = 0;
      if (y === Math.round(bind)) out.restBind = rest;
      if (rest === 0 && out.payoff === null) out.payoff = y;
      out.zins.push(zs); out.tilg.push(ts); out.sonder.push(ss); out.rate.push(rs); out.rest.push(rest);
    }
    return out;
  }

  function irr(flows) {
    if (!flows.some(f => Math.abs(f) > 0.005)) return null;
    const npv = r => { let s = 0; for (let t = 0; t < flows.length; t++) s += flows[t] / Math.pow(1 + r, t); return s; };
    let prevR = -0.9, prevV = npv(prevR);
    for (let r = -0.89; r <= 1.0001; r += 0.01) {
      const v = npv(r);
      if (isFinite(v) && isFinite(prevV) && (v === 0 || (v > 0) !== (prevV > 0))) {
        let a = prevR, b = r, va = prevV;
        for (let i = 0; i < 60; i++) {
          const mid = (a + b) / 2, vm = npv(mid);
          if ((vm > 0) === (va > 0)) { a = mid; va = vm; } else b = mid;
        }
        return (a + b) / 2;
      }
      prevR = r; prevV = v;
    }
    return null;
  }

  function calc(o, A, ov) {
    ov = ov || {};
    const preis = has(ov.preis) ? ov.preis : n(o.preis);
    const sp = n(o.stellplatz), inv = n(o.inventar);
    const immo = preis + sp, kauf = immo + inv;
    const grestSatz = has(o.grest) ? o.grest : (GREST[o.land] ?? 5);
    const grest = immo * grestSatz / 100;
    const notar = kauf * n(o.notar) / 100, grundbuch = kauf * n(o.grundbuch) / 100, makler = kauf * n(o.makler) / 100;
    const gutachter = n(o.gutachter);
    const nk = grest + notar + grundbuch + makler + gutachter;
    const sanStau = sanierung(o);
    const san = o.sanEin === false ? 0 : sanStau;
    const gesamt = kauf + nk + san;

    /* Boden, AfA */
    const bodenWert = (n(o.bodenrichtwert) > 0 && n(o.grundstueck) > 0) ? o.bodenrichtwert * o.grundstueck : immo * n(o.bodenProz) / 100;
    const bodenAnteil = immo > 0 ? Math.min(0.95, Math.max(0, bodenWert / immo)) : 0;
    const gebPreis = immo * (1 - bodenAnteil);
    const nkRest = notar + grundbuch + makler + gutachter;
    const nkGeb = grest * (1 - bodenAnteil) + (kauf > 0 ? nkRest * gebPreis / kauf : 0);
    const nkInv = kauf > 0 ? nkRest * inv / kauf : 0;
    let afaBasis = gebPreis + nkGeb;
    const anschaffungsnah = san > 0 && san / 1.19 > 0.15 * afaBasis;
    if (anschaffungsnah) afaBasis += san;
    const sofort = san > 0 && !anschaffungsnah ? san : 0;
    const bj = n(o.baujahr) > 1700 ? o.baujahr : JAHR;
    const afaSatz = bj < 1925 ? 2.5 : bj >= 2023 ? 3 : 2;
    const afaGeb = afaBasis * afaSatz / 100;
    const afaInv = (inv + nkInv) / 10;
    const akVerkauf = immo + nk - nkInv + (anschaffungsnah ? san : 0);

    /* Miete und laufende Kosten */
    const flaeche = n(o.flaeche);
    const jm0 = n(o.miete) * 12;
    const ausfallSatz = Math.max(0, n(o.ausfall) + (ov.dAusfall || 0)) / 100;
    const instand = has(o.instand) ? o.instand : instandRichtwert(o);
    const kostenHG = n(o.hausgeld) * 12, kostenVw = n(o.verwaltung) * 12, kostenIh = instand * flaeche;
    const kosten0 = kostenHG + kostenVw + kostenIh;
    const mietst = (n(o.mietst) + (ov.dMiete || 0)) / 100;
    const wertst = (n(o.wertst) + (ov.dWert || 0)) / 100;
    const kostst = (n(A.kostenst) + (ov.dKosten || 0)) / 100;

    /* Finanzierung */
    const ekEff = Math.min(Math.max(0, n(o.ek)), gesamt);
    const bedarf = Math.max(0, gesamt - ekEff);
    const kfw = o.kfwOn ? Math.min(Math.max(0, n(o.kfwBetrag)), bedarf) : 0;
    const L1 = bedarf - kfw;
    const zins = n(o.zins);
    const delta = (has(o.anschluss) ? o.anschluss - zins : 0) + (ov.dZins || 0);
    const d1 = simLoan(L1, zins, n(o.tilg), n(o.bindung), Math.max(0, zins + delta), n(o.sonder));
    const d2 = simLoan(kfw, n(o.kfwZins), n(o.kfwTilg), n(o.kfwBindung), Math.max(0, n(o.kfwZins) + delta), 0);

    const steuer = n(A.steuer) / 100;
    const r = n(A.etf) / 100, etfSt = n(A.etfSteuer) / 100, vkSatz = n(A.vk) / 100;
    const jahre = [{ y: 0, wert: immo, rest: bedarf, vermoegen: immo * (1 - vkSatz) - bedarf, etf: ekEff, eingesetzt: ekEff, zuz: 0, tilgKum: 0, ws: 0, side: 0, vk: immo * vkSatz, speku: 0 }];
    let cumAfa = 0, side = 0, sideIn = 0, depot = ekEff, depotIn = ekEff, zuz = 0;
    for (let y = 1; y <= Y; y++) {
      const i = y - 1;
      const jm = jm0 * Math.pow(1 + mietst, i);
      const ausfall = jm * ausfallSatz;
      const kf = Math.pow(1 + kostst, i);
      const kosten = kosten0 * kf;
      const noi = jm - ausfall - kosten;
      const zinsen = d1.zins[i] + d2.zins[i];
      const tilg = d1.tilg[i] + d2.tilg[i];
      const sonder = d1.sonder[i] + d2.sonder[i];
      const rate = d1.rate[i] + d2.rate[i];
      const rest = d1.rest[i] + d2.rest[i];
      const cfv = noi - rate;
      const afaG = Math.min(afaGeb, Math.max(0, afaBasis - cumAfa));
      cumAfa += afaG;
      const afa = afaG + (y <= 10 ? afaInv : 0);
      const ergLfd = jm - ausfall - kosten - zinsen - afa;
      const erg = ergLfd - (y === 1 ? sofort : 0);
      const st = erg * steuer;
      const stLfd = ergLfd * steuer;
      const cfn = cfv - st;
      const cfnLfd = cfv - stLfd;
      const cash = cfn - sonder;
      const wert = immo * Math.pow(1 + wertst, y);
      const vk = wert * vkSatz;
      const gewinn = wert - vk - (akVerkauf - cumAfa);
      const speku = y < 10 && gewinn > 0 ? gewinn * steuer : 0;
      const netto = wert - vk - rest - speku;
      side = side * (1 + r) + Math.max(0, cash); sideIn += Math.max(0, cash);
      depot = depot * (1 + r) + Math.max(0, -cash); depotIn += Math.max(0, -cash);
      zuz += Math.max(0, -cash);
      const sideNet = side - Math.max(0, side - sideIn) * etfSt;
      const etfNet = depot - Math.max(0, depot - depotIn) * etfSt;
      jahre.push({
        y, jm, ausfall, kosten, kostenHG: kostenHG * kf, kostenVw: kostenVw * kf, kostenIh: kostenIh * kf, noi,
        zinsen, tilg, sonder, rate, rest, cfv, afa, erg, st, stLfd, cfn, cfnLfd, cash,
        wert, vk, speku, netto, side: sideNet, vermoegen: netto + sideNet, etf: etfNet,
        eingesetzt: ekEff + zuz, zuz, tilgKum: bedarf - rest, ws: wert - immo
      });
    }

    const H = Math.max(1, Math.min(Y, Math.round(n(A.halte)) || 15));
    const fl = [-ekEff], fe = [-ekEff];
    for (let y = 1; y <= H; y++) {
      const j = jahre[y];
      fl.push(j.cash + (y === H ? j.netto : 0));
      fe.push(-Math.max(0, -j.cash) + (y === H ? j.etf : 0));
    }
    const j1 = jahre[1];
    let zinsGesamt = 0;
    for (let y = 1; y <= Y; y++) zinsGesamt += jahre[y].zinsen;
    const payoff = (d1.payoff === null || d2.payoff === null) ? null : Math.max(d1.payoff, d2.payoff);

    return {
      preis, sp, inv, immo, kauf, grestSatz, grest, notar, grundbuch, makler, gutachter, nk, sanStau, san, gesamt,
      bodenWert, bodenAnteil, gebPreis, afaBasis, afaSatz, afaGeb, afaInv, anschaffungsnah, sofort, sofortEffekt: sofort * steuer,
      instand, instandRichtwert: instandRichtwert(o), kosten0, jm0, ausfallSatz,
      ekEff, ekUeber: Math.max(0, n(o.ek) - gesamt), bedarf, kfw, L1, d1, d2, delta, az: zins + delta,
      jahre, H, irrImmo: irr(fl), irrEtf: irr(fe), flowSum: fl.reduce((a, b) => a + b, 0),
      faktor: jm0 > 0 ? immo / jm0 : null,
      brutto: immo > 0 ? jm0 / immo * 100 : null,
      netto: gesamt > 0 ? j1.noi / gesamt * 100 : null,
      dscr: j1.rate > 0 ? j1.noi / j1.rate : null,
      cfvMon: j1.cfv / 12, cfnMon: j1.cfnLfd / 12, rateMon: j1.rate / 12,
      effZins: bedarf > 0 ? (L1 * zins + kfw * n(o.kfwZins)) / bedarf : zins,
      zinsGesamt, payoff
    };
  }

  function stressRow(o, A, c, d) {
    const bind = Math.round(n(o.bindung));
    const L = c.L1 + c.kfw;
    if (!(L > 0)) return { d, none: "Kein Darlehen" };
    if (bind < 1 || bind >= Y) return { d, none: "Keine Anschlussfinanzierung im Rechenzeitraum" };
    const vor = c.jahre[bind], nach = c.jahre[bind + 1];
    if (!(vor.rest > 0)) return { d, none: "Darlehen ist vorher getilgt" };
    return { d, az: c.az, rateVor: vor.rate / 12, rateNach: nach.rate / 12, cfnNach: nach.cfnLfd / 12, jahr: bind + 1 };
  }

  const BESICHT_IDS = ["dach", "decke", "eindeckung", "feucht", "schimmel", "fenster", "heizung", "elektrik", "leitungen", "bad", "fassade", "schadstoff", "balkon"];

  function bewerten(o, A, c) {
    const fehlt = fehlend(o);
    if (fehlt.length) return { fehlt, verdict: null };
    const puffer = n(A.puffer);
    const stress = [0, 2, 4].map(d => stressRow(o, A, d === 0 ? c : calc(o, A, { dZins: d }), d));
    const checks = o.checks || {};
    const krit = Object.values(checks).filter(v => v === "krit").length;
    const maengel = BESICHT_IDS.filter(k => checks[k] === "mangel").length;
    const flags = [];
    if (krit) flags.push({ s: "r", t: krit === 1 ? "1 kritischer Punkt im Objekt-Check" : krit + " kritische Punkte im Objekt-Check" });
    if (n(o.vergleichQm) > 0 && n(o.flaeche) > 0) {
      const ratio = (o.miete / o.flaeche) / o.vergleichQm;
      if (ratio > 1.2) flags.push({ s: "r", t: "Miete " + Math.round((ratio - 1) * 100) + " % über der Vergleichsmiete: Mietpreisbremse und Leerstandsrisiko prüfen" });
      else if (ratio > 1.1) flags.push({ s: "y", t: "Miete " + Math.round((ratio - 1) * 100) + " % über der Vergleichsmiete" });
    }
    if (c.bedarf > 0) {
      const b = Math.round(n(o.bindung));
      if (b < 5) flags.push({ s: "r", t: "Zinsbindung unter 5 Jahren: hohes Zinsrisiko" });
      else if (b < 10) flags.push({ s: "y", t: "Zinsbindung unter 10 Jahren" });
    }
    const s2 = stress[1];
    if (s2 && !s2.none) {
      if (s2.cfnNach < -2 * puffer) flags.push({ s: "r", t: "Bei +2 % Anschlusszins zahlst du " + Math.round(-s2.cfnNach) + " € im Monat zu" });
      else if (s2.cfnNach < -puffer) flags.push({ s: "y", t: "Bei +2 % Anschlusszins zahlst du " + Math.round(-s2.cfnNach) + " € im Monat zu (über deinem Puffer)" });
    }
    if (["F", "G", "H"].includes(o.energie)) flags.push({ s: "y", t: "Energieklasse " + o.energie + ": Modernisierung und CO₂-Kostenanteil einplanen" });
    if (n(o.flaeche) > 0 && c.sanStau / o.flaeche > 200) flags.push({ s: "y", t: "Sanierungsstau über 200 € je m²" });
    if (maengel >= 3) flags.push({ s: "y", t: maengel + " Mängel bei der Besichtigung" });

    const P = {};
    P.preis = c.faktor <= 20 ? "g" : c.faktor <= 25 ? "y" : "r";
    P.liq = c.cfnMon >= 0 ? "g" : c.cfnMon >= -puffer ? "y" : "r";
    if (c.irrImmo === null) P.rendite = c.flowSum >= 0 ? "g" : "r";
    else if (c.irrEtf === null) P.rendite = c.irrImmo >= 0.05 ? "g" : c.irrImmo >= 0.03 ? "y" : "r";
    else P.rendite = c.irrImmo >= c.irrEtf ? "g" : c.irrImmo >= c.irrEtf - 0.02 ? "y" : "r";
    P.risiko = flags.some(f => f.s === "r") ? "r" : flags.some(f => f.s === "y") ? "y" : "g";
    const vals = Object.values(P);
    const reds = vals.filter(v => v === "r").length, yel = vals.filter(v => v === "y").length;
    const verdict = reds >= 2 ? "r" : (reds === 0 && yel <= 1) ? "g" : "y";
    return { fehlt, P, flags, stress, verdict, puffer };
  }

  function hoechstpreis(test, p0) {
    let lo = 1000, hi = Math.max(5000, p0 * 2);
    if (!test(lo)) return { none: true };

function checkGroups(o) { return ["makro", "mikro", "besicht", o.art === "etw" ? "etw" : "haus"]; }
function checkProgress(o) {

  checkGroups(o).forEach(g => CHECK[g].items.forEach(([id]) => {

/* ---------- Diagramm-Bausteine ---------- */
function waterfall(steps, opts = {}) {
  let run = 0;
  const rows = steps.filter(s => s && isFinite(s.v)).map(s => {
    if (s.kind === "sub" || s.kind === "end") { run = s.v; return Object.assign({}, s, { a: 0, b: s.v }); }
    const a = run; run += s.v; return Object.assign({}, s, { a, b: run });
  });
  const pts = rows.flatMap(r => [r.a, r.b]).concat([0]);
  if (opts.ref != null && isFinite(opts.ref)) pts.push(opts.ref);
  const lo = Math.min(...pts), hi = Math.max(...pts);
  const span = hi - lo || 1;
  const X = v => (v - lo) / span * 100;
  const fmt = opts.fmt || fEurS;
  return `<div class="wf" role="table" aria-label="${esc(opts.label || "Aufstellung")}">${rows.map(r => {
    const x1 = X(Math.min(r.a, r.b)), x2 = X(Math.max(r.a, r.b));
    const cls = r.cls || (r.kind === "sub" ? "sub" : r.v >= 0 ? "pos" : "neg");
    const ref = (r.kind === "end" && opts.ref != null && isFinite(opts.ref)) ? `<i class="wf-ref" style="left:${X(opts.ref)}%" title="${esc(opts.refLabel || "")}"></i>` : "";
    return `<div class="wf-row ${r.kind || ""}" role="row"><span class="wf-l" role="cell">${esc(r.label)}</span><span class="wf-track" aria-hidden="true"><i class="wf-zero" style="left:${X(0)}%"></i><b class="wf-bar ${cls}" style="left:${x1}%;width:${Math.max(0.5, x2 - x1)}%"></b>${ref}</span><span class="wf-v" role="cell">${fmt(r.v)}</span></div>`;
  }).join("")}</div>`;
}
function bullet(ratio, zones, labels) {
  const lo = 0.7, hi = 1.4;
  const X = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  let prev = lo;
  const segs = zones.map(([to, cls]) => { const w = X(to) - X(prev); prev = to; return `<i class="${cls}" style="width:${w}%"></i>`; }).join("");
  return `<div class="bullet"><div class="bullet-wrap"><div class="bullet-track">${segs}</div><span class="bullet-ref" style="left:${X(1)}%"></span><span class="bullet-mark" style="left:${X(ratio)}%"></span></div><div class="bullet-legend">${labels}</div></div>`;
}
function mieteBullet(o) {
  if (!(o.vergleichQm > 0 && o.flaeche > 0 && o.miete > 0)) return `<span class="muted tiny">Vergleichsmiete eintragen, dann siehst du hier die Einordnung.</span>`;
  const ist = o.miete / o.flaeche, ratio = ist / o.vergleichQm;
  const s = ratio > 1.2 ? "r" : ratio > 1.1 ? "y" : ratio < 0.9 ? "b" : "g";
  const txt = { r: "deutlich über Mietspiegel", y: "über Mietspiegel", b: "unter Mietspiegel: Potenzial", g: "im Rahmen des Mietspiegels" }[s];
  return bullet(ratio, [[0.9, "bz-b"], [1.1, "bz-g"], [1.2, "bz-y"], [1.4, "bz-r"]],
    `<span>Ist <b class="mono">${fNum(ist, 2)} €/m²</b> · Mietspiegel ${fNum(o.vergleichQm, 2)} €/m²</span><span class="chip ${s}">${sym(s)} ${fNum((ratio - 1) * 100, 0)} % · ${txt}</span>`);
}
function preisBullet(o) {
  if (!(o.marktQm > 0 && o.flaeche > 0 && o.preis > 0)) return "";
  const ist = o.preis / o.flaeche, ratio = ist / o.marktQm;
  const s = ratio > 1.15 ? "r" : ratio > 1.05 ? "y" : ratio < 0.95 ? "g" : "b";
  const txt = { r: "deutlich über Markt", y: "über Markt", g: "unter Markt", b: "marktüblich" }[s];
  return bullet(ratio, [[0.95, "bz-g"], [1.05, "bz-b"], [1.15, "bz-y"], [1.4, "bz-r"]],
    `<span>Ist <b class="mono">${fNum(ist, 0)} €/m²</b> · Markt ${fNum(o.marktQm, 0)} €/m²</span><span class="chip ${s}">${sym(s)} ${fNum((ratio - 1) * 100, 0)} % · ${txt}</span>`);
}
function niceTicks(min, max, count) {
  const span = (max - min) || Math.abs(max) || 1;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const nrm = raw / mag;
  const step = (nrm < 1.5 ? 1 : nrm < 3 ? 2 : nrm < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v / step) * step);
  return t;
}

/* Vermögensdiagramm: Immobilie (realistisch, Spanne pessimistisch–optimistisch) gegen ETF */
let PROG = null;
function drawWealth(el) {
  if (!PROG || !el) return;
  const { real, pess, opt, bind } = PROG;
  const N = 30;
  const W = Math.max(280, Math.round(el.clientWidth));
  const H = W < 520 ? 250 : 300;
  const bindG = bind > 0 && bind < N;
  const twoGuides = bindG && bind !== 10;
  const m = { l: 56, r: 14, t: twoGuides ? 42 : 28, b: 30 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const vals = [];
  for (let y = 0; y <= N; y++) vals.push(real.jahre[y].vermoegen, pess.jahre[y].vermoegen, opt.jahre[y].vermoegen, real.jahre[y].etf);
  const ticks = niceTicks(Math.min(0, ...vals), Math.max(...vals), 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = y => m.l + y / N * pw;
  const Yp = v => m.t + (1 - (v - y0) / (y1 - y0)) * ph;
  const line = (arr, key) => arr.slice(0, N + 1).map((j, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Yp(j[key]).toFixed(1)).join(" ");
  let band = "";
  for (let y = 0; y <= N; y++) band += (y ? "L" : "M") + X(y).toFixed(1) + " " + Yp(Math.max(opt.jahre[y].vermoegen, pess.jahre[y].vermoegen)).toFixed(1);
  for (let y = N; y >= 0; y--) band += "L" + X(y).toFixed(1) + " " + Yp(Math.min(opt.jahre[y].vermoegen, pess.jahre[y].vermoegen)).toFixed(1);
  band += "Z";
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Vermögen bei Verkauf über 30 Jahre: Immobilie gegen ETF-Sparplan">`;
  ticks.forEach(t => { s += `<line class="${t === 0 ? "base" : "gridl"}" x1="${m.l}" x2="${W - m.r}" y1="${Yp(t).toFixed(1)}" y2="${Yp(t).toFixed(1)}"></line><text x="${m.l - 8}" y="${(Yp(t) + 4).toFixed(1)}" text-anchor="end">${fT(t)}</text>`; });
  [0, 5, 10, 15, 20, 25, 30].forEach(y => { s += `<text x="${X(y).toFixed(1)}" y="${H - 8}" text-anchor="middle">${y}</text>`; });
  const guides = [];
  if (bindG) guides.push([bind, bind === 10 ? "Zinsbindung · Spekulationsfrist" : "Ende Zinsbindung"]);
  if (bind !== 10) guides.push([10, "Spekulationsfrist"]);
  guides.forEach(([gy, gl], gi) => {
    s += `<line class="guide" x1="${X(gy).toFixed(1)}" x2="${X(gy).toFixed(1)}" y1="${m.t - 4}" y2="${m.t + ph}"></line>`;
    const anchor = X(gy) > W - 150 ? "end" : "start";
    s += `<text x="${(X(gy) + (anchor === "end" ? -4 : 4)).toFixed(1)}" y="${m.t - 10 - gi * 14}" text-anchor="${anchor}" style="font-family:var(--f-body)">${esc(gl)}</text>`;
  });
  s += `<path class="band" d="${band}"></path>`;
  s += `<path class="l-etf" d="${line(real.jahre, "etf")}"></path>`;
  s += `<path class="l-immo" d="${line(real.jahre, "vermoegen")}"></path>`;
  [10, 20, 30].forEach(y => {
    s += `<circle class="m-etf" cx="${X(y).toFixed(1)}" cy="${Yp(real.jahre[y].etf).toFixed(1)}" r="4.5"></circle>`;
    s += `<circle class="m-immo" cx="${X(y).toFixed(1)}" cy="${Yp(real.jahre[y].vermoegen).toFixed(1)}" r="4.5"></circle>`;
  });
  /* Endbeschriftung, Kollisionen vermeiden */
  let yi = Yp(real.jahre[N].vermoegen), ye = Yp(real.jahre[N].etf);
  if (Math.abs(yi - ye) < 30) { const mid = (yi + ye) / 2; if (yi <= ye) { yi = mid - 15; ye = mid + 15; } else { yi = mid + 15; ye = mid - 15; } }
  const lx = X(N) - 8;
  s += `<text class="lab" x="${lx}" y="${(yi - 8).toFixed(1)}" text-anchor="end">Immobilie ${fT(real.jahre[N].vermoegen)}</text>`;
  s += `<text class="lab" x="${lx}" y="${(ye + (ye > yi ? 18 : -8)).toFixed(1)}" text-anchor="end">ETF ${fT(real.jahre[N].etf)}</text>`;
  s += `<line class="cross" id="w-cross" x1="0" x2="0" y1="${m.t}" y2="${m.t + ph}" style="display:none"></line>`;
  s += `<rect id="w-hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent"></rect></svg><div class="tip" id="w-tip" hidden></div>`;
  el.innerHTML = s;
  const hit = el.querySelector("#w-hit"), cross = el.querySelector("#w-cross"), tip = el.querySelector("#w-tip");
  const show = ev => {
    const rect = el.getBoundingClientRect();
    const px = ev.clientX - rect.left;
    const y = Math.max(0, Math.min(N, Math.round((px - m.l) / pw * N)));
    const r = real.jahre[y], p = pess.jahre[y], o = opt.jahre[y];
    cross.setAttribute("x1", X(y)); cross.setAttribute("x2", X(y)); cross.style.display = "";
    const diff = r.vermoegen - r.etf;
    tip.innerHTML = `<div class="tr"><span>Jahr ${y}</span></div>
      <div class="tr"><span>Immobilie</span><b>${fT(r.vermoegen)}</b></div>
      <div class="tr"><span>Spanne</span><b>${fT(Math.min(p.vermoegen, o.vermoegen))} – ${fT(Math.max(p.vermoegen, o.vermoegen))}</b></div>
      <div class="tr"><span>ETF</span><b>${fT(r.etf)}</b></div>
      <div class="tr"><span>Vorsprung</span><b>${(diff > 0 ? "+" : "") + fT(diff)}</b></div>
      <div class="tr"><span>Eingesetzt</span><b>${fT(r.eingesetzt)}</b></div>`;
    tip.hidden = false;
    const tw = tip.offsetWidth;
    let left = X(y) + 12; if (left + tw > W) left = X(y) - tw - 12;
    tip.style.left = Math.max(0, left) + "px"; tip.style.top = (m.t + 4) + "px";
  };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; cross.style.display = "none"; });
}
function drawCharts() { document.querySelectorAll("[data-chart='wealth']").forEach(drawWealth); }

      <p class="muted">Trag Kaufpreis, Miete, Fläche und Baujahr ein. Die Objektakte rechnet Nebenkosten, Finanzierung, Steuern und Rendite und gibt dir ein Ampel-Urteil. Unten siehst du ein durchgerechnetes Beispiel.</p>

function sampleBanner(o) {

function viewUrteil(o) {
  const { c, b } = evaluate(o);
  if (!b.verdict) {
    return `<section class="view">${sampleBanner(o)}<div class="verdict n"><span class="eyebrow">Urteil</span><div class="v-word">Daten fehlen</div><p class="v-lead">Für ein Urteil fehlen noch: ${esc(b.fehlt.join(", "))}.</p><div><button class="btn primary" data-act="sub" data-v="daten">Daten eintragen</button></div></div></section>`;
  }
  const A = S.settings;
  const P = b.P;
  const etf = c.irrEtf;
  const pTxt = {
    preis: { g: `Faktor ${fNum(c.faktor, 1)}: Preis passt zur Miete.`, y: `Faktor ${fNum(c.faktor, 1)}: eher teuer. Faktor 20 wären ${fEur(20 * c.jm0 - c.sp)}.`, r: `Faktor ${fNum(c.faktor, 1)}: zu teuer für eine Vermietung. Faktor 25 wären ${fEur(25 * c.jm0 - c.sp)}.` }[P.preis],
    liq: { g: `Trägt sich selbst: ${fEurS(c.cfnMon)} im Monat nach Steuern.`, y: `Du zahlst ${fEur(-c.cfnMon)} im Monat zu, im Rahmen deines Puffers von ${fEur(A.puffer)}.`, r: `Du zahlst ${fEur(-c.cfnMon)} im Monat zu, mehr als dein Puffer von ${fEur(A.puffer)}.` }[P.liq],
    rendite: c.irrImmo == null ? (P.rendite === "g" ? "Ohne Eigenkapital und ohne Zuzahlung: Rendite nicht begrenzt." : "Am Ende bleibt weniger übrig, als du eingesetzt hast.") : c.irrEtf == null ? `${fPct(c.irrImmo * 100)} p. a. auf dein Eigenkapital.` :
      { g: `${fPct(c.irrImmo * 100)} p. a. auf dein Eigenkapital, besser als der ETF (${fPct(etf * 100)}).`, y: `${fPct(c.irrImmo * 100)} p. a., knapp unter dem ETF (${fPct(etf * 100)}).`, r: `${fPct(c.irrImmo * 100)} p. a., deutlich unter dem ETF (${fPct(etf * 100)}).` }[P.rendite],
    risiko: b.flags.length ? esc(b.flags[0].t) + (b.flags.length > 1 ? ` (+${b.flags.length - 1} weitere)` : "") : "Keine erhöhten Risiken erkannt."
  };
  const pill = (k, label) => `<li>${sym(P[k])}<b>${label}</b><span class="t">${pTxt[k]}</span></li>`;

  /* Höchstpreis */
  const tr = R.hoechstpreis(p => R.calc(Object.assign({}, o, { preis: p }), A).cfnMon >= A.zielCf, o.preis);
  const kf = R.hoechstpreis(p => { const o2 = Object.assign({}, o, { preis: p }); const c2 = R.calc(o2, A); return R.bewerten(o2, A, c2).verdict === "g"; }, o.preis);
  const PNAME = { preis: "Preis", liq: "Liquidität", rendite: "Rendite", risiko: "Risiko" };
  let flip = "";
  if (!kf.none && !kf.above) {
    const pAt = p => { const o2 = Object.assign({}, o, { preis: p }); return R.bewerten(o2, A, R.calc(o2, A)).P; };
    const a = pAt(kf.p), z = pAt(kf.p + 1000);
    const ch = Object.keys(a).filter(k => a[k] === "g" && z[k] !== "g").map(k => PNAME[k]);
    if (ch.length) flip = "darüber wird " + ch.join(" und ") + " gelb";
  }
  const f20 = { p: Math.max(0, Math.floor((20 * c.jm0 - c.sp) / 500) * 500) };
  const maxRow = (title, res, noneText, extra) => {
    if (res.none) return `<div class="maxrow"><span>${title}</span><span class="v">–</span><span class="sub">${noneText}</span></div>`;
    const d = res.p - o.preis, pct = d / o.preis * 100;
    const s = d >= 0 ? "g" : pct >= -10 ? "y" : "r";
    return `<div class="maxrow"><span>${title}</span><span class="v">${res.above ? "über " : ""}${fEur(res.p)}</span><span class="sub"><span class="chip ${s}">${sym(s)} ${d >= 0 ? "Preis passt" : fPct(pct, 0)}</span> ${d >= 0 ? "Spielraum: " + fEur(d) : "Verhandlungsziel: " + fEur(-d) + " weniger"}${extra ? ", " + extra : ""}</span></div>`;
  };

  const tiles = [
    ["faktor", "Kaufpreisfaktor", fNum(c.faktor, 1), P.preis, "Grün bis 20 · Rot über 25"],
    ["brutto", "Bruttomietrendite", fPct(c.brutto), P.preis, "Grün ab 5 % · Rot unter 4 %"],
    ["netto", "Nettomietrendite", fPct(c.netto), c.netto >= c.effZins ? "g" : c.netto >= c.effZins - 1 ? "y" : "r", `Grün über Kreditzins (${fPct(c.effZins, 2)})`],
    ["dscr", "Kapitaldienstdeckung", c.dscr == null ? "–" : fNum(c.dscr, 2), c.dscr == null ? "g" : c.dscr >= 1.2 ? "g" : c.dscr >= 1 ? "y" : "r", "Grün ab 1,2 · Rot unter 1,0"],
    ["cashflow", "Cashflow vor Steuern", fEurS(c.cfvMon), c.cfvMon >= 0 ? "g" : c.cfvMon >= -A.puffer ? "y" : "r", "pro Monat, erstes Jahr"],
    ["cashflow", "Cashflow nach Steuern", fEurS(c.cfnMon), P.liq, `Puffer: ${fEur(A.puffer)}/Monat`],

  ];

  const j1 = c.jahre[1];
  const cfSteps = [
    { label: "Kaltmiete", v: j1.jm / 12, cls: "pos" },
    { label: "Mietausfall", v: -j1.ausfall / 12 },
    { label: o.art === "etw" ? "Hausgeld, nicht umlagefähig" : "Nicht umlagefähige Kosten", v: -j1.kostenHG / 12 },
    { label: "Mietverwaltung", v: -j1.kostenVw / 12 },
    { label: "Instandhaltung", v: -j1.kostenIh / 12 },
    { label: "Reinertrag", v: j1.noi / 12, kind: "sub" },
    { label: "Zinsen", v: -j1.zinsen / 12 },
    { label: "Tilgung", v: -j1.tilg / 12 },
    { label: "Cashflow vor Steuern", v: j1.cfv / 12, kind: "sub" },
    { label: j1.stLfd <= 0 ? "Steuererstattung" : "Steuer", v: -j1.stLfd / 12, cls: j1.stLfd <= 0 ? "pos" : "" },
    { label: "Cashflow nach Steuern", v: j1.cfnLfd / 12, kind: "end", cls: P.liq }
  ];

  const st = b.stress;
  const H = hints(o, c, b);
  const allNotes = b.flags.map(f => ({ s: f.s, t: f.t })).concat(H);

  return `<section class="view">
    ${sampleBanner(o)}
    <div class="verdict ${b.verdict}">
      <div class="card-head"><span class="eyebrow">Urteil ${ib("urteil")}</span><span class="ak">${esc(o.ak || "")}</span></div>
      <div class="v-word">${VERDICT[b.verdict]}</div>
      <p class="v-lead">${VERDICT_LEAD[b.verdict]}</p>
      <ul class="pillars">${pill("preis", "Preis")}${pill("liq", "Liquidität")}${pill("rendite", "Rendite")}${pill("risiko", "Risiko")}</ul>
    </div>

    <div class="card">
      <div class="card-head"><h3>Höchstpreis ${ib("hoechstpreis")}</h3><span class="muted small">Angebot: ${fEur(o.preis)}</span></div>
      <div>
        ${maxRow("Für Faktor 20 (fairer Preis)", f20, "")}
        ${maxRow(`Damit es sich selbst trägt (Cashflow ab ${fEur(A.zielCf)})`, tr, "Auch bei sehr niedrigem Preis nicht erreichbar. Prüfe Kosten und Finanzierung.")}
        ${maxRow("Für das Urteil Kaufen", kf, "Nicht über den Preis lösbar: Ein Risiko-Punkt bleibt rot. Siehe Hinweise.", flip)}
      </div>
      <p class="muted tiny">Eigenkapital und Finanzierung bleiben gleich, die Nebenkosten passen sich dem Preis an.</p>
    </div>

    <div class="tiles">${tiles.map(([g, l, v, s, thr]) => `<div class="tile"><div class="lbl"><span>${l}</span>${ib(g)}</div><div class="val ${s === "b" ? "" : s}">${v}</div><div class="thr">${sym(s)} ${thr}</div></div>`).join("")}</div>

    <div class="card">
      <div class="card-head"><h3>Monatsrechnung im ersten Jahr</h3>${ib("cashflow")}</div>
      ${waterfall(cfSteps, { label: "Monatlicher Cashflow" })}
      ${c.sofortEffekt > 0 ? `<p class="muted tiny">Einmalig im ersten Jahr zusätzlich: rund ${fEur(c.sofortEffekt)} Steuerersparnis durch die sofort absetzbare Sanierung.</p>` : ""}
    </div>

    <div class="card">
      <div class="card-head"><h3>Warnungen und Hinweise</h3><span class="muted small">${b.flags.length === 0 ? "keine Warnung" : b.flags.length === 1 ? "1 Warnung" : b.flags.length + " Warnungen"}</span></div>

    </div>
  </section>`;
}

    }).join("")}

}

    <tr><td>Kaufpreis, Stellplatz, Inventar</td><td class="n">${fEur(c.kauf)}</td></tr>
    <tr><td>Sanierungsstau aus dem Check ${c.san ? "" : `<span class="muted">(${c.sanStau ? "nicht eingerechnet" : "keiner erfasst"})</span>`}</td><td class="n">${fEur(c.san)}</td></tr>
    <tr class="total"><td>Gesamtinvestition ${ib("gesamt")}</td><td class="n">${fEur(c.gesamt)}</td></tr>
  </tbody></table>`;
}
function afaLine(c) {
  return `Bodenanteil ${fPct(c.bodenAnteil * 100, 0)} · AfA-Basis ${fEur(c.afaBasis)} · ${fPct(c.afaSatz, 1)} = <b>${fEur(c.afaGeb)}</b> pro Jahr${c.afaInv > 0 ? ` · Inventar ${fEur(c.afaInv)} pro Jahr` : ""}`;
}
function noiTable(o, c) {
  const j1 = c.jahre[1];
  return `<table class="sumtable"><tbody>
    <tr><td>Jahreskaltmiete</td><td class="n">${fEur(j1.jm)}</td></tr>

}

function viewDaten(o) {

  return `<section class="view">
    ${sampleBanner(o)}
    <div class="card">
      <h3>Objekt</h3>
      <div class="fgrid">
        ${field(o, "name", { full: true })}
        ${field(o, "adresse", { full: true })}
        <div class="fld full"><div class="lbl"><span>Objektart</span></div>${seg("art", ART, o.art)}</div>
        <div class="fld"><div class="lbl"><label for="f-land">Bundesland</label>${ib("grest")}</div><select id="f-land" data-k="land">${Object.entries(R.LAENDER).map(([k, l]) => `<option value="${k}" ${o.land === k ? "selected" : ""}>${l} · ${fNum(R.GREST[k], 1)} %</option>`).join("")}</select></div>
        <div class="fld"><div class="lbl"><label for="f-energie">Energieklasse</label>${ib("energie")}</div><select id="f-energie" data-k="energie">${ENERGIE.map(e => `<option value="${e}" ${o.energie === e ? "selected" : ""}>${e === "?" ? "unbekannt" : e}</option>`).join("")}</select></div>
        ${field(o, "baujahr")}
        ${field(o, "flaeche")}
        ${field(o, "zimmer")}
        ${o.art === "mfh" ? field(o, "einheiten") : field(o, "marktQm", { hint: "Gutachterausschuss oder Portale" })}
        ${o.art === "mfh" ? field(o, "marktQm", { hint: "Gutachterausschuss oder Portale", full: true }) : ""}
        <div class="fld full"><div class="lbl"><span>Zustand</span></div>${seg("zustand", ZUSTAND, o.zustand)}</div>
      </div>
      <div data-live="preisbullet">${preisBullet(o)}</div>
    </div>

    <div class="card">
      <h3>Kaufpreis und Boden</h3>
      <div class="fgrid">
        ${field(o, "preis", { full: true })}

        ${field(o, "inventar")}
        ${field(o, "bodenProz", { hint: "Wohnung oft 15–25 %, Haus 25–40 %" })}
        ${field(o, "bodenrichtwert", { hint: '<a href="https://www.bodenrichtwerte-boris.de" target="_blank" rel="noopener">BORIS: Bodenrichtwerte</a>' })}
        ${field(o, "grundstueck", { hint: "Ersetzt den Prozentwert, wenn beides gefüllt" })}

    <div class="card">

      <div class="fgrid">

        ${field(o, "makler", { hint: "Käuferanteil, meist 3,57 %" })}
        ${field(o, "notar")}
        ${field(o, "grundbuch")}
        ${field(o, "gutachter", { hint: "optional, z. B. Bausachverständiger" })}
      </div>
      <label class="switch"><input type="checkbox" id="f-sanEin" data-k="sanEin" ${o.sanEin !== false ? "checked" : ""}><span>Sanierungsstau aus dem Check einrechnen (${fEur(c.sanStau)})</span></label>
      <div data-live="nk">${nkTable(o, c)}</div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Miete und laufende Kosten</h3>${ib("cashflow")}</div>
      <div class="fgrid">
        ${field(o, "miete", { hint: o.miete && o.flaeche ? `= ${fNum(o.miete / o.flaeche, 2)} €/m²` : "" })}
        ${field(o, "vergleichQm")}
        <div class="full" data-live="mietebullet">${mieteBullet(o)}</div>
        ${field(o, "mietst")}
        ${field(o, "wertst")}
        ${field(o, "hausgeld", { label: o.art === "etw" ? "Hausgeld, nicht umlagefähig" : "Nicht umlagefähige Kosten", hint: o.art === "etw" ? "Aus der Jahresabrechnung" : "z. B. Kontoführung" })}
        ${field(o, "verwaltung", { hint: o.art === "mfh" ? "für alle Einheiten zusammen" : "" })}
        ${field(o, "instand", { ph: fmtIn(rw, 2) + " Richtwert", hint: `Leer = Richtwert ${fNum(rw, 2)} €/m²${o.art === "etw" ? " (Sondereigentum)" : ""}` })}

}

function finSummary(o, c) {
  const restPct = c.L1 > 0 && c.d1.restBind != null ? c.d1.restBind / c.L1 * 100 : 0;
  const rs = restPct > 75 ? "y" : "g";
  const dk = c.preis > 0 ? c.bedarf / c.immo * 100 : 0;
  return `<div class="tiles">
    <div class="tile"><div class="lbl"><span>Darlehen gesamt</span>${ib("ek")}</div><div class="val">${fEur(c.bedarf)}</div><div class="thr">${sym(dk > 100 ? "y" : "b")} ${fPct(dk, 0)} vom Kaufpreis</div></div>
    <div class="tile"><div class="lbl"><span>Monatsrate</span>${ib("annuitaet")}</div><div class="val">${fEur(c.rateMon)}</div><div class="thr">${sym("b")} Zins und Tilgung</div></div>
    <div class="tile"><div class="lbl"><span>Restschuld nach ${Math.round(o.bindung)} J.</span>${ib("restschuld")}</div><div class="val ${rs}">${c.L1 > 0 && c.d1.restBind != null ? fEur(c.d1.restBind) : "–"}</div><div class="thr">${sym(rs)} ${fPct(restPct, 0)} des Hauptdarlehens</div></div>
    <div class="tile"><div class="lbl"><span>Schuldenfrei</span></div><div class="val">${c.payoff === null ? "nie" : c.payoff ? "Jahr " + c.payoff : "–"}</div><div class="thr">${sym("b")} Zinsen gesamt ${fEur(c.zinsGesamt)}</div></div>
  </div>`;
}
function tilgPlan(o, c) {
  if (!(c.bedarf > 0)) return `<p class="muted">Kein Darlehen: Das Eigenkapital deckt die Gesamtinvestition.</p>`;
  const last = c.payoff || 50;
  const rows = [];
  for (let y = 1; y <= Math.min(50, last); y++) {
    const j = c.jahre[y];
    rows.push(`<tr class="${y === Math.round(o.bindung) ? "mark" : ""}"><td>${y}${y === Math.round(o.bindung) ? " · Ende Bindung" : ""}</td><td>${fEur(j.rate)}</td><td>${fEur(j.zinsen)}</td><td>${fEur(j.tilg)}</td><td>${fEur(j.sonder)}</td><td>${fEur(j.rest)}</td></tr>`);
  }
  return `<div class="tscroll tall"><table class="data"><thead><tr><th>Jahr</th><th>Rate</th><th>Zinsen</th><th>Tilgung</th><th>Sondertilg.</th><th>Restschuld</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
function viewFinanzierung(o) {
  const { c, b } = evaluate(o);
  return `<section class="view">
    ${sampleBanner(o)}
    <div class="card">
      <div class="card-head"><h3>Eigenkapital</h3>${ib("ek")}</div>
      <div class="fgrid">${field(o, "ek", { full: true })}</div>
      <p class="small" data-live="ekline">${ekLine(c)}</p>
    </div>
    <div class="card">
      <div class="card-head"><h3>Hauptdarlehen</h3><span class="muted small" data-live="l1">${fEur(c.L1)}</span></div>
      <div class="fgrid">
        ${field(o, "zins", { hint: "Oktober 2026: rund 4 % bei 10 Jahren" })}
        ${field(o, "tilg")}
        ${field(o, "bindung")}
        ${field(o, "sonder")}
        ${field(o, "anschluss", { ph: fmtIn(o.zins, 2) + " wie heute", hint: "Leer = gleicher Zins wie heute", full: true })}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Zweites Darlehen</h3>${ib("kfw")}</div>
      <label class="switch"><input type="checkbox" id="f-kfwOn" data-k="kfwOn" ${o.kfwOn ? "checked" : ""}><span>KfW- oder zweites Darlehen nutzen</span></label>
      ${o.kfwOn ? `<div class="fgrid">${field(o, "kfwBetrag")}${field(o, "kfwZins")}${field(o, "kfwTilg")}${field(o, "kfwBindung")}</div>` : ""}
    </div>
    <div data-live="finsum">${finSummary(o, c)}</div>
    <div class="card">
      <div class="card-head"><h3>Stresstest Anschlusszins</h3>${ib("stresstest")}</div>
      <div data-live="stress">${b.verdict ? stressTable(b.stress, b.puffer) : `<p class="muted">Erst Daten vervollständigen.</p>`}</div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Tilgungsplan</h3>${downloads ? `<button class="btn sm" data-act="csv">Als CSV speichern</button>` : ""}</div>
      <div data-live="tilg">${tilgPlan(o, c)}</div>
    </div>
  </section>`;
}
function ekLine(c) {
  const ok = c.ekEff >= c.nk;
  return `${sym(ok ? "g" : "y")} ${fPct(c.gesamt > 0 ? c.ekEff / c.gesamt * 100 : 0, 0)} der Gesamtinvestition. ${ok ? "Deckt die Kaufnebenkosten (" + fEur(c.nk) + ")." : "Deckt die Kaufnebenkosten (" + fEur(c.nk) + ") nicht."}`;
}

function viewPrognose(o) {
  const { c, b } = evaluate(o);
  if (!b.verdict) return `<section class="view">${sampleBanner(o)}<div class="empty"><h3>Für die Prognose fehlen Daten</h3><p class="muted">${esc(b.fehlt.join(", "))}</p><button class="btn primary" data-act="sub" data-v="daten">Daten eintragen</button></div></section>`;
  const A = S.settings;
  const pess = R.calc(o, A, R.SZEN.pess), opt = R.calc(o, A, R.SZEN.opt);
  PROG = { real: c, pess, opt, bind: Math.round(o.bindung) };
  const hz = [10, 20, 30];
  const t = V.horizon;
  const j = c.jahre[t];
  const gain = j.vermoegen - j.eingesetzt, etfGain = j.etf - j.eingesetzt;
  const gs = gain >= etfGain ? "g" : gain >= 0 ? "y" : "r";
  const steps = [
    { label: "Tilgung", v: j.tilgKum },
    { label: "Deine Zuzahlungen", v: -j.zuz },
    { label: "Wertsteigerung", v: j.ws },
    { label: "Angesparte Überschüsse", v: j.side },
    { label: "Kaufnebenkosten, Sanierung, Inventar", v: -(c.nk + c.san + c.inv) },
    { label: "Verkaufskosten und Steuer", v: -(j.vk + j.speku) },
    { label: `Gewinn nach ${t} Jahren`, v: gain, kind: "end", cls: gs }
  ].filter(s => Math.abs(s.v) >= 1 || s.kind === "end");
  const row = (label, f) => `<tr><td>${label}</td>${hz.map(y => `<td>${f(y)}</td>`).join("")}</tr>`;
  return `<section class="view">
    ${sampleBanner(o)}
    <div class="card">
      <div class="card-head"><h3>Vermögen bei Verkauf</h3>${ib("szenarien")}</div>
      <div class="legend"><span><i class="lg-immo"></i>Immobilie, realistisch</span><span><i class="lg-band"></i>Spanne pessimistisch bis optimistisch</span><span><i class="lg-etf"></i>ETF-Sparplan</span></div>
      <div class="chart" data-chart="wealth"></div>
      <p class="muted tiny">Nach Verkaufskosten, Restschuld und Steuern. Der ETF bekommt dasselbe Geld: dein Eigenkapital und jede Zuzahlung. Antippen zeigt die Werte je Jahr.</p>
    </div>
    <div class="card">
      <h3>Jahr 10, 20 und 30</h3>
      <div class="tscroll"><table class="data"><thead><tr><th>Vermögen</th><th>10 J.</th><th>20 J.</th><th>30 J.</th></tr></thead><tbody>
        ${row("Pessimistisch", y => fEur(pess.jahre[y].vermoegen))}
        ${row("Realistisch", y => `<b>${fEur(c.jahre[y].vermoegen)}</b>`)}
        ${row("Optimistisch", y => fEur(opt.jahre[y].vermoegen))}
        ${row("ETF-Sparplan", y => fEur(c.jahre[y].etf))}
        ${row("Eingesetzt", y => fEur(c.jahre[y].eingesetzt))}
        ${row("Restschuld", y => fEur(c.jahre[y].rest))}
        ${row("Immobilienwert", y => fEur(c.jahre[y].wert))}
      </tbody></table></div>
      <div class="tscroll"><table class="data"><thead><tr><th>Rendite p. a. (${c.H} J.)</th><th>Pess.</th><th>Real.</th><th>Opt.</th><th>ETF</th></tr></thead><tbody>
        <tr><td>Eigenkapitalrendite</td><td>${pess.irrImmo == null ? "–" : fPct(pess.irrImmo * 100)}</td><td><b>${c.irrImmo == null ? "–" : fPct(c.irrImmo * 100)}</b></td><td>${opt.irrImmo == null ? "–" : fPct(opt.irrImmo * 100)}</td><td>${c.irrEtf == null ? "–" : fPct(c.irrEtf * 100)}</td></tr>
      </tbody></table></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Woraus entsteht dein Gewinn?</h3>${seg("horizon", { 10: "10 J.", 20: "20 J.", 30: "30 J." }, String(t), "horizon")}</div>
      ${waterfall(steps, { label: "Gewinnzerlegung", ref: etfGain, refLabel: "ETF-Gewinn" })}
      <p class="small"><span class="chip ${gs}">${sym(gs)} ${gain >= etfGain ? "besser als der ETF" : gain >= 0 ? "Gewinn, aber unter dem ETF" : "Verlust"}</span> ETF-Gewinn im Vergleich: <b class="mono">${fEurS(etfGain)}</b> <span class="muted">(violette Linie)</span>. Eingesetzt: ${fEur(j.eingesetzt)}.</p>
    </div>
    <div class="note ${A.halte < 10 ? "y" : "b"}">${sym(A.halte < 10 ? "y" : "b")}<span><b>Spekulationsfrist:</b> Verkaufst du vor Ablauf von 10 Jahren, versteuerst du den Gewinn mit deinem Grenzsteuersatz. Die Prognose berücksichtigt das. ${ib("speku")}</span></div>
  </section>`;
}

function viewCheck(o) {
  const groups = checkGroups(o);
  const { c } = evaluate(o);
  const group = g => {
    const def = CHECK[g];
    const items = def.items;
    let ok = 0, m = 0, k = 0, cnt = 0;
    items.forEach(([id]) => { if (id === "sonst") return; cnt++; const s = o.checks[id]; if (s === "ok") ok++; else if (s === "mangel") m++; else if (s === "krit") k++; });
    return `<div class="card">
      <div class="card-head"><h3>${def.t}</h3><span class="muted small">${ok + m + k}/${cnt} geprüft</span></div>
      <div class="progress" aria-hidden="true"><i class="p-ok" style="width:${ok / cnt * 100}%"></i><i class="p-m" style="width:${m / cnt * 100}%"></i><i class="p-k" style="width:${k / cnt * 100}%"></i></div>
      <div>${items.map(([id, t, d]) => {
        const s = o.checks[id] || "";
        const costVisible = def.cost && (s === "mangel" || s === "krit" || id === "sonst");
        return `<div class="citem">
          <span class="ct">${esc(t)}</span>${d ? `<span class="cd">${esc(d)}</span>` : ""}
          <div class="cstate">
            ${id === "sonst" ? "" : [["ok", "OK"], ["mangel", "Mangel"], ["krit", "Kritisch"]].map(([v, l]) => `<button type="button" class="${v}" data-act="check" data-id="${id}" data-v="${v}" aria-pressed="${s === v}">${l}</button>`).join("")}
            ${costVisible ? `<div class="inp"><input id="cost-${id}" data-cost="${id}" type="text" inputmode="decimal" autocomplete="off" value="${fmtIn(o.costs[id], 0)}" placeholder="Kosten" aria-label="Geschätzte Kosten ${esc(t)}"><span class="u">€</span></div>` : ""}
          </div>
        </div>`;
      }).join("")}</div>
      ${def.cost ? `<div class="sumtable-wrap"><table class="sumtable"><tbody><tr class="total"><td>Sanierungsstau</td><td class="n" data-live="sanstau">${fEur(c.sanStau)}</td></tr></tbody></table><label class="switch" style="margin-top:8px"><input type="checkbox" id="f-sanEin2" data-k="sanEin" ${o.sanEin !== false ? "checked" : ""}><span>In die Gesamtinvestition einrechnen</span></label></div>` : ""}
      ${g === "etw" ? `<div class="fgrid">${field(o, "ruecklage", { full: true, hint: o.ruecklage > 0 && o.flaeche > 0 ? `= ${fNum(o.ruecklage / o.flaeche, 0)} €/m². Mit den angekündigten Maßnahmen in den Protokollen abgleichen.` : "" })}</div>` : ""}
    </div>`;
  };
  return `<section class="view">
    ${sampleBanner(o)}
    <div class="card">
      <h3>Status und Notizen</h3>
      ${seg("status", STATUS, o.status)}
      <div class="fld"><div class="lbl"><label for="f-notes">Notizen</label></div><textarea id="f-notes" data-k="notes" data-text="1" placeholder="Eindrücke, Fragen an Makler oder Verwaltung, Verhandlungsstand …">${esc(o.notes || "")}</textarea></div>
    </div>
    ${groups.map(group).join("")}
    ${isSample(o) ? "" : `<div class="card">
      <h3>Akte</h3>
      <div class="row"><button class="btn" data-act="dup">Kopie anlegen</button><button class="btn danger" data-act="del">Objekt löschen</button></div>
      <p class="muted tiny">Eine Kopie eignet sich, um Varianten zu vergleichen, etwa mehr Eigenkapital oder einen niedrigeren Preis.</p>
    </div>`}
  </section>`;
}

function viewVergleich() {
  const pool = S.objects.concat([SAMPLE]);
  V.cmp = V.cmp.filter(id => pool.some(o => o.id === id));
  if (!V.cmp.length) V.cmp = pool.slice(0, Math.min(3, pool.length)).map(o => o.id);
  const sel = V.cmp.map(getObj).filter(Boolean);
  const ev = sel.map(o => ({ o, ...evaluate(o) }));
  const rows = [
    ["Urteil", e => verdictChip(e.b), null],
    ["Status", e => esc(STATUS[e.o.status] || ""), null],
    ["Kaufpreis", e => fEur(e.o.preis), e => e.o.preis, "min"],
    ["Preis je m²", e => e.o.flaeche ? fEur(e.o.preis / e.o.flaeche) : "–", e => e.o.flaeche ? e.o.preis / e.o.flaeche : null, "min"],
    ["Gesamtinvestition", e => fEur(e.c.gesamt), null],
    ["Kaltmiete/Monat", e => fEur(e.o.miete), null],
    ["Miete je m²", e => e.o.flaeche ? fNum(e.o.miete / e.o.flaeche, 2) + " €" : "–", e => e.o.flaeche ? e.o.miete / e.o.flaeche : null, "max"],
    ["Kaufpreisfaktor", e => fNum(e.c.faktor, 1), e => e.c.faktor, "min"],
    ["Bruttomietrendite", e => fPct(e.c.brutto), e => e.c.brutto, "max"],
    ["Nettomietrendite", e => fPct(e.c.netto), e => e.c.netto, "max"],
    ["Cashflow n. St./Monat", e => fEurS(e.c.cfnMon), e => e.c.cfnMon, "max"],
    ["Eigenkapitalrendite", e => e.c.irrImmo == null ? "–" : fPct(e.c.irrImmo * 100), e => e.c.irrImmo, "max"],
    ["Vermögen nach 20 J.", e => fEur(e.c.jahre[20].vermoegen), e => e.c.jahre[20].vermoegen, "max"],
    ["Eigenkapital", e => fEur(e.c.ekEff), null],
    ["Sanierungsstau", e => fEur(e.c.sanStau), e => e.c.sanStau, "min"]
  ];
  return `<section class="view">
    <h2>Vergleich</h2>
    <div class="stack"><span class="muted small">Bis zu 4 Objekte auswählen:</span>
      <div class="row">${pool.map(o => `<button class="chip ${V.cmp.includes(o.id) ? "b" : ""}" data-act="cmp" data-id="${o.id}" aria-pressed="${V.cmp.includes(o.id)}">${esc(o.ak || "")} ${esc(o.name || "Ohne Namen")}</button>`).join("")}</div>
    </div>
    ${ev.length ? `<div class="tscroll"><table class="data"><thead><tr><th>Kennzahl</th>${ev.map(e => `<th>${esc(e.o.name || "Ohne Namen")}</th>`).join("")}</tr></thead><tbody>
      ${rows.map(([label, f, val, dir]) => {
        let best = null;
        if (val && ev.length > 1) {
          const vs = ev.map(e => e.b.verdict ? val(e) : null).filter(v => v != null && isFinite(v));
          if (vs.length > 1) best = dir === "min" ? Math.min(...vs) : Math.max(...vs);
        }
        return `<tr><td>${label}</td>${ev.map(e => { const v = val && e.b.verdict ? val(e) : null; return `<td class="${best != null && v === best ? "best" : ""}">${f(e)}</td>`; }).join("")}</tr>`;
      }).join("")}
    </tbody></table></div><p class="muted tiny">Grün markiert: bester Wert der Zeile.</p>` : `<p class="muted">Noch nichts ausgewählt.</p>`}
  </section>`;
}
