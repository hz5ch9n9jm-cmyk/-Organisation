/* ---------- Render ---------- */
const TABS = [
  ["objekte", "Objekte", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>'],
  ["vergleich", "Vergleich", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>'],
  ["annahmen", "Annahmen", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>'],
  ["wissen", "Wissen", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 8h6"/></svg>']
];
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([k, l, ic]) => `<button data-act="tab" data-v="${k}" ${V.tab === k && !V.obj ? 'aria-current="page"' : ""}>${ic}<span>${l}</span></button>`).join("");
}
let needRender = false;
function render() {
  needRender = false;
  renderTop();
  renderTabs();
  const main = $("#main");
  const active = document.activeElement && document.activeElement.id;
  let html;
  if (V.obj) {
    const o = getObj(V.obj);
    if (!o) { V.obj = null; return render(); }
    html = ({ urteil: viewUrteil, daten: viewDaten, finanzierung: viewFinanzierung, prognose: viewPrognose, check: viewCheck }[V.sub] || viewUrteil)(o);
  } else {
    html = ({ objekte: viewList, vergleich: viewVergleich, annahmen: viewAnnahmen, wissen: viewWissen }[V.tab] || viewList)();
  }
  main.innerHTML = html;
  if (active) { const el = document.getElementById(active); if (el && main.contains(el)) el.focus(); }
  requestAnimationFrame(drawCharts);
}
function safeRender() {
  const a = document.activeElement;
  if (a && $("#main").contains(a) && a.matches("input[type=text], textarea")) { needRender = true; liveUpdate(); }
  else render();
}
function liveUpdate() {
  if (!V.obj) return;
  const o = getObj(V.obj); if (!o) return;
  const { c, b } = evaluate(o);
  const set = (k, html) => document.querySelectorAll(`[data-live="${k}"]`).forEach(el => { el.innerHTML = html; });
  set("topchip", verdictChip(b));
  set("strip", liveStrip(o));
  set("nk", nkTable(o, c));
  set("afa", afaLine(c));
  set("noi", noiTable(o, c));
  set("mietebullet", mieteBullet(o));
  set("preisbullet", preisBullet(o));
  set("hint-miete", o.miete && o.flaeche ? `= ${fNum(o.miete / o.flaeche, 2)} €/m²` : "");
  set("finsum", finSummary(o, c));
  set("ekline", ekLine(c));
  set("l1", fEur(c.L1));
  set("stress", b.verdict ? stressTable(b.stress, b.puffer) : `<p class="muted">Erst Daten vervollständigen.</p>`);
  set("tilg", tilgPlan(o, c));
  set("sanstau", fEur(c.sanStau));
}
function go(patch) { Object.assign(V, patch); saveView(); render(); window.scrollTo({ top: 0 }); }

let toastT;
function toast(msg) {
  let el = $(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2400);
}
function sheet(html) {
  $("#layer").innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${html}<div class="row"><button class="btn primary" data-act="close">Verstanden</button></div></div></div>`;
}
const closeSheet = () => { $("#layer").innerHTML = ""; };

/* ---------- Aktionen ---------- */
function nextAk() {
  const nr = (S.settings.akNr || 0) + 1;
  S.settings.akNr = nr; touchSettings();
  return "OA-" + String(new Date().getFullYear()).slice(2) + "-" + String(nr).padStart(3, "0");
}
function addObject(o) {
  o.id = uid(); o.ak = nextAk(); o.created = Date.now(); o.updatedAt = Date.now();
  S.objects.push(o);
  touch(o);
  return o;
}
const armed = new Map();
function armOrRun(btn, key, label, fn) {
  if (armed.get(key)) { armed.delete(key); fn(); return; }
  armed.set(key, true);
  btn.classList.add("armed"); btn.textContent = "Wirklich? Nochmal tippen";
  setTimeout(() => { armed.delete(key); if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = label; } }, 3500);
}
async function save(filename, data, okMsg) {
  if (!downloads) return;
  try { const r = await downloads.save({ filename, data }); if (r && r.status === "saved") toast(okMsg); }
  catch (e) { toast("Nicht gespeichert"); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "close") { if (e.target === b || b.tagName === "BUTTON") closeSheet(); return; }
  const o = V.obj ? getObj(V.obj) : null;
  switch (act) {
    case "tab": go({ tab: b.dataset.v, obj: null }); break;
    case "open": go({ obj: b.dataset.id, sub: "urteil" }); break;
    case "back": go({ obj: null }); break;
    case "sub": go({ sub: b.dataset.v }); break;
    case "new": { const n = addObject(newObject()); n.name = ""; go({ obj: n.id, sub: "daten" }); setTimeout(() => { const el = $("#f-name"); if (el) el.focus(); }, 50); break; }
    case "adopt": {
      const copy = normObj(JSON.parse(JSON.stringify(SAMPLE)));
      copy.name = "Kopie: " + SAMPLE.name; copy.status = "idee";
      addObject(copy); SAMPLE = makeSample();
      go({ obj: copy.id }); toast("Als eigenes Objekt gespeichert");
      break;
    }
    case "dup": {
      if (!o) return;
      const copy = normObj(JSON.parse(JSON.stringify(o)));
      copy.name = "Variante: " + (o.name || "Objekt");
      addObject(copy); go({ obj: copy.id, sub: "urteil" }); toast("Kopie angelegt");
      break;
    }
    case "del": {
      if (!o || isSample(o)) return;
      armOrRun(b, "del" + o.id, "Objekt löschen", () => {
        S.objects = S.objects.filter(x => x.id !== o.id);
        deletedIds.add(o.id); syncedIds.delete(o.id);
        writeLocal(); scheduleWrite("o_" + o.id, 10);
        go({ obj: null }); toast("Objekt gelöscht");
      });
      break;
    }
    case "set": {
      if (!o) return;
      o[b.dataset.k] = b.dataset.v;
      if (b.dataset.k === "art") {
        if (b.dataset.v === "etw" && !(o.bodenProz > 0)) o.bodenProz = 20;
        if (b.dataset.v !== "etw" && o.bodenProz === 20) o.bodenProz = b.dataset.v === "haus" ? 30 : 25;
      }
      touch(o); render();
      break;
    }
    case "check": {
      if (!o) return;
      const id = b.dataset.id, v = b.dataset.v;
      o.checks[id] = o.checks[id] === v ? "" : v;
      if (!o.checks[id]) delete o.checks[id];
      touch(o); render();
      break;
    }
    case "horizon": V.horizon = +b.dataset.v; saveView(); render(); break;
    case "cmp": {
      const id = b.dataset.id;
      if (V.cmp.includes(id)) V.cmp = V.cmp.filter(x => x !== id);
      else { if (V.cmp.length >= 4) { toast("Höchstens 4 Objekte"); return; } V.cmp.push(id); }
      saveView(); render();
      break;
    }
    case "gloss": { const g = G[b.dataset.k]; if (g) sheet(`<span class="eyebrow">Erklärung</span><h2>${esc(g[0])}</h2><p>${esc(g[1])}</p>`); break; }
    case "resetset": {
      armOrRun(b, "resetset", "Auf Standard zurücksetzen", () => {
        const nr = S.settings.akNr; S.settings = Object.assign({}, DEF_SET, { akNr: nr });
        touchSettings(); render(); toast("Annahmen zurückgesetzt");
      });
      break;
    }
    case "export": save("objektakte-sicherung-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify({ app: "objektakte", v: 1, objects: S.objects, settings: S.settings }, null, 2), "Sicherung gespeichert"); break;
    case "csv": {
      if (!o) return;
      const c = R.calc(o, S.settings);
      const last = c.payoff || 50;
      const lines = ["Jahr;Rate;Zinsen;Tilgung;Sondertilgung;Restschuld"];
      for (let y = 1; y <= Math.min(50, last); y++) { const j = c.jahre[y]; lines.push([y, j.rate, j.zinsen, j.tilg, j.sonder, j.rest].map((v, i) => i ? v.toFixed(2).replace(".", ",") : v).join(";")); }
      save("tilgungsplan-" + (o.ak || "objekt") + ".csv", lines.join("\n"), "Tilgungsplan gespeichert");
      break;
    }
  }
});

function setField(key, raw, isText) {
  const sc = key.startsWith("s.");
  const k = sc ? key.slice(2) : key;
  let v;
  if (isText) v = raw;
  else {
    v = parseNum(raw);
    if (Number.isNaN(v)) return false;
  }
  if (sc) {
    if (v === null && !isText) v = DEF_SET[k];
    S.settings[k] = v; touchSettings();
    return true;
  }
  const o = getObj(V.obj); if (!o) return false;
  o[k] = v;
  touch(o);
  return true;
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.cost) {
    const o = getObj(V.obj); if (!o) return;
    const v = parseNum(t.value);
    if (Number.isNaN(v)) return;
    if (v === null) delete o.costs[t.dataset.cost]; else o.costs[t.dataset.cost] = v;
    touch(o); liveUpdate();
    return;
  }
  const key = t.dataset.k;
  if (!key || t.type === "checkbox" || t.tagName === "SELECT") return;
  const isText = (F[key] && F[key].text) || t.dataset.text === "1";
  if (setField(key, t.value, isText)) {
    if (key === "name" && V.obj) { const tb = $(".obj-title b"); if (tb) tb.textContent = t.value || "Ohne Namen"; }
    liveUpdate();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "import-file") return importFile(t);
  const key = t.dataset.k;
  if (t.dataset.cost) { if (needRender) render(); return; }
  if (!key) return;
  if (t.type === "checkbox") {
    const o = getObj(V.obj); if (!o) return;
    o[key] = t.checked; touch(o); render();
    return;
  }
  if (t.tagName === "SELECT") {
    if (key.startsWith("s.")) { S.settings[key.slice(2)] = t.value; touchSettings(); }
    else { const o = getObj(V.obj); if (!o) return; o[key] = t.value; touch(o); }
    render();
    return;
  }
  const f = F[key];
  if (f && !f.text && t.dataset.text !== "1") {
    const v = parseNum(t.value);
    if (Number.isNaN(v)) { toast("Bitte eine Zahl eintragen, z. B. 3,5"); t.value = fmtIn(getVal(getObj(V.obj) || {}, key), f.d, f.grp); return; }
    t.value = fmtIn(key.startsWith("s.") ? S.settings[key.slice(2)] : v, f.d, f.grp);
  }
  if (needRender || key.startsWith("s.") || ["art"].includes(key)) render();
});
document.addEventListener("focusout", () => { if (needRender) setTimeout(() => { const a = document.activeElement; if (!(a && a.matches && a.matches("input[type=text], textarea"))) render(); }, 0); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function importFile(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.objects)) throw new Error("x");
      d.objects.forEach(x => {
        const o = normObj(x);
        const i = S.objects.findIndex(y => y.id === o.id);
        if (i >= 0) S.objects[i] = o; else S.objects.push(o);
        deletedIds.delete(o.id);
        touch(o);
      });
      if (d.settings) { S.settings = Object.assign({}, DEF_SET, d.settings); touchSettings(); }
      render(); toast(d.objects.length + " Objekte geladen");
    } catch (err) { toast("Datei ist keine gültige Objektakte-Sicherung"); }
  };
  r.readAsText(f);
}

let rsT;
let lastW = 0;
if (window.ResizeObserver) new ResizeObserver(() => { const w = $("#main").clientWidth; if (w === lastW) return; lastW = w; clearTimeout(rsT); rsT = setTimeout(drawCharts, 120); }).observe($("#main"));
setInterval(() => { const d = $("#dtg"); if (d) d.textContent = "DTG " + dtg(new Date()); }, 15000);
render();
connect();
})();
