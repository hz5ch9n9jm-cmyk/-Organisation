<title>Lagezentrum</title>
<meta name="description" content="Persönliches Organisations-Tool: Tageslage, Aufgaben, Routinen, Wochenplan Kassel/Zuhause und Ziele.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: einspaltige Feldbuch-App, max. 720px, feste Tab-Leiste unten; Lage-Seite zuerst, Details dahinter. */
:root {
  --bg: #eceee6;
  --surface: #f8f9f4;
  --sunk: #e2e5da;
  --ink: #1c2119;
  --muted: #5a6155;
  --line: #d0d4c6;
  --accent: #2e3a2a;
  --accent-fg: #f2f4ec;
  --ok: #2b8547;   --ok-bg: #dcefe1;
  --warn: #b98a00; --warn-bg: #f6ebc4;
  --crit: #c0392b; --crit-bg: #f6dcd8;
  --info: #2b67ad; --info-bg: #dbe6f3;
  --shadow: 0 1px 0 rgba(28,33,25,.06), 0 6px 18px -10px rgba(28,33,25,.25);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131611; --surface: #1b1f18; --sunk: #232820; --ink: #e7eadf; --muted: #9ba293; --line: #31372d;
    --accent: #cbd5b9; --accent-fg: #151812;
    --ok: #5cc27b; --ok-bg: rgba(92,194,123,.14);
    --warn: #e6bd3a; --warn-bg: rgba(230,189,58,.14);
    --crit: #ef6b5d; --crit-bg: rgba(239,107,93,.15);
    --info: #6ba6e8; --info-bg: rgba(107,166,232,.15);
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131611; --surface: #1b1f18; --sunk: #232820; --ink: #e7eadf; --muted: #9ba293; --line: #31372d;
  --accent: #cbd5b9; --accent-fg: #151812;
  --ok: #5cc27b; --ok-bg: rgba(92,194,123,.14);
  --warn: #e6bd3a; --warn-bg: rgba(230,189,58,.14);
  --crit: #ef6b5d; --crit-bg: rgba(239,107,93,.15);
  --info: #6ba6e8; --info-bg: rgba(107,166,232,.15);
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-inline: 16px; padding-block: 0 calc(88px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 720px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.15rem; font-weight: 600; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-display); font-weight: 600; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

/* Kopf */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-size: 1.6rem; text-transform: uppercase; letter-spacing: .06em; }
.dtg { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); letter-spacing: .04em; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sync { font-size: .75rem; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
.sync.on i { background: var(--ok); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }

main { display: flex; flex-direction: column; gap: 18px; padding-block: 18px; }
section.view { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
section.view > * { min-width: 0; }
.chip.wrap { white-space: normal; }
.brand h1, .task-title, h3 { hyphens: auto; }
@media (max-width: 480px) { .sync span { display: none; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.plain { padding: 0; display: flex; flex-direction: column; gap: 10px; }

/* Ort-Leiste */
.lage-strip { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; }
.chip.loc-k { background: var(--info-bg); color: var(--info); border-color: transparent; }
.chip.loc-h { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.r { background: var(--crit-bg); color: var(--crit); border-color: transparent; }
.chip.y { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.b { background: var(--info-bg); color: var(--info); border-color: transparent; }
.chip.g { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
button.chip { cursor: pointer; }

/* Nächster Schritt */
.next {
  background: var(--accent); color: var(--accent-fg); border-radius: var(--r); padding: 18px;
  display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow);
}
.next .eyebrow { color: color-mix(in srgb, var(--accent-fg) 70%, transparent); }
.next .step { overflow-wrap: break-word; hyphens: auto; font-family: var(--f-display); font-size: clamp(1.35rem, 6vw, 1.7rem); font-weight: 700; line-height: 1.1; text-wrap: balance; }
.next .for { font-size: .92rem; opacity: .85; }
.next .row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; padding: 9px 14px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 40px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.next .btn { background: var(--accent-fg); color: var(--accent); border-color: transparent; }
.next .btn.ghost { background: transparent; color: var(--accent-fg); border-color: color-mix(in srgb, var(--accent-fg) 40%, transparent); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.danger { color: var(--crit); border-color: var(--crit); background: transparent; }
.btn.danger.armed { background: var(--crit); color: #fff; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: .88rem; }
.btn.link { border: none; background: none; padding: 4px 0; min-height: 0; color: var(--info); font-weight: 600; }

/* Aufgaben */
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.task { display: grid; grid-template-columns: 4px 32px 1fr; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: none; }
.task .stripe { align-self: stretch; border-radius: 2px; background: var(--info); }
.task.r .stripe { background: var(--crit); }
.task.y .stripe { background: var(--warn); }
.task.done .stripe { background: var(--ok); }
.check { width: 28px; height: 28px; border-radius: 7px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; margin-top: 1px; }
.check svg { width: 16px; height: 16px; opacity: 0; }
.done .check, .check.on { background: var(--ok); border-color: var(--ok); }
.done .check svg, .check.on svg { opacity: 1; color: #fff; }
.task-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; background: none; border: none; text-align: left; padding: 0; }
.task-title { font-weight: 600; overflow-wrap: anywhere; }
.done .task-title { text-decoration: line-through; color: var(--muted); }
.task-next { font-size: .88rem; color: var(--muted); overflow-wrap: anywhere; }
.task-next b { color: var(--ink); font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }

.quick { display: flex; gap: 8px; }
.quick input { flex: 1; min-width: 0; }
input[type=text], input[type=date], input[type=number], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-height: 42px;
}
textarea { min-height: 84px; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: .88rem; font-weight: 600; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.seg button.r[aria-pressed="true"] { background: var(--crit); border-color: var(--crit); color: #fff; }
.seg button.y[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #1c1a10; }
.seg button.b[aria-pressed="true"] { background: var(--info); border-color: var(--info); color: #fff; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.filters button { flex-shrink: 0; }

/* Routinen */
.habit { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.habit:first-child { border-top: none; }
.habit-name { font-weight: 600; background: none; border: none; text-align: left; padding: 0; overflow-wrap: anywhere; }
.habit-hint { font-size: .85rem; color: var(--muted); grid-column: 1 / -1; margin-top: -4px; }
.week7 { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.d7 { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .7rem; color: var(--muted); font-family: var(--f-display); font-weight: 600; letter-spacing: .06em; }
.d7 span.box { width: 100%; max-width: 40px; height: 26px; border-radius: 6px; background: var(--sunk); border: 1px solid transparent; }
.d7.ok span.box { background: var(--ok); }
.d7.miss span.box { background: transparent; border: 1px dashed var(--crit); }
.d7.na span.box { background: transparent; border: 1px dashed var(--line); }
.d7.today { color: var(--ink); }
.d7.today span.box { outline: 2px solid var(--ink); outline-offset: 1px; }
.streak { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); white-space: nowrap; }
.streak b { color: var(--ink); font-size: 1rem; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill-habit { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px 6px 6px; font-weight: 600; font-size: .92rem; }
.pill-habit .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.pill-habit .dot svg { width: 14px; height: 14px; opacity: 0; color: #fff; }
.pill-habit.on { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.pill-habit.on .dot { background: var(--ok); border-color: var(--ok); }
.pill-habit.on .dot svg { opacity: 1; }

/* Woche */
.days { display: flex; flex-direction: column; }
.day { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.day:first-child { border-top: none; }
.day.today { background: linear-gradient(90deg, var(--sunk), transparent); border-radius: 8px; margin-inline: -8px; padding-inline: 8px; }
.day-name { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; line-height: 1; }
.day-date { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.day-body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.blocks { margin: 0; padding-left: 18px; font-size: .95rem; }
.blocks li::marker { color: var(--muted); }
.dtask { font-size: .9rem; display: flex; gap: 6px; align-items: baseline; }
.pdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; background: var(--info); transform: translateY(-1px); }
.pdot.r { background: var(--crit); } .pdot.y { background: var(--warn); } .pdot.g { background: var(--ok); }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.checklist li { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; }
.checklist li.done span.t { text-decoration: line-through; color: var(--muted); }
.checklist span.t { overflow-wrap: anywhere; }
.x { border: none; background: none; color: var(--muted); padding: 4px 6px; font-size: 1.1rem; line-height: 1; }

/* Ziele */
.goal { display: flex; flex-direction: column; gap: 10px; }
.goal-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.goal-head h3 { overflow-wrap: anywhere; }
.bar { height: 10px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--info); border-radius: 999px; transition: width .3s; }
.bar.full > i { background: var(--ok); }
.pct { font-family: var(--f-mono); font-weight: 700; font-size: 1.1rem; }
.goal-why { font-size: .92rem; color: var(--muted); margin: 0; }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; min-width: 0; }

.verse { font-size: .98rem; margin: 0; font-style: italic; }
.verse cite { display: block; font-style: normal; font-size: .82rem; color: var(--muted); margin-top: 4px; font-family: var(--f-mono); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-mono); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78rem; color: var(--muted); }
.note { border-radius: 8px; padding: 10px 12px; font-size: .9rem; display: flex; gap: 8px; }
.note.info { background: var(--info-bg); }
.note.warn { background: var(--warn-bg); }
.note b { font-weight: 700; }

.empty { text-align: left; padding: 18px; border: 1.5px dashed var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

/* Tab-Leiste */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
nav.tabs .in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
nav.tabs button { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 8px; color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--ink); background: var(--sunk); }
.badge { font-family: var(--f-mono); font-size: .65rem; background: var(--crit); color: #fff; border-radius: 999px; padding: 0 5px; margin-left: 2px; }

/* Bogen (Sheet) */
.scrim { position: fixed; inset: 0; background: rgba(10,12,9,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 16px; } }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }

/* Fokus */
.focus { position: fixed; inset: 0; z-index: 30; background: var(--accent); color: var(--accent-fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px 16px; text-align: center; }
.focus .clock { font-family: var(--f-mono); font-weight: 700; font-size: clamp(4rem, 22vw, 9rem); line-height: 1; font-variant-numeric: tabular-nums; }
.focus .what { font-family: var(--f-display); font-size: 1.4rem; font-weight: 600; max-width: 30ch; text-wrap: balance; }
.focus .seg button { background: transparent; color: var(--accent-fg); border-color: color-mix(in srgb, var(--accent-fg) 35%, transparent); }
.focus .seg button[aria-pressed="true"] { background: var(--accent-fg); color: var(--accent); }
.focus .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.focus .btn { background: var(--accent-fg); color: var(--accent); border: none; min-width: 120px; }
.focus .btn.ghost { background: transparent; color: var(--accent-fg); border: 1px solid color-mix(in srgb, var(--accent-fg) 40%, transparent); }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; z-index: 40; max-width: calc(100% - 32px); }
details > summary { cursor: pointer; font-weight: 600; color: var(--muted); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; font-family: var(--f-mono); }
details[open] > summary::before { content: "− "; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
(function () {
"use strict";

/* ---------- Grundlagen ---------- */
const STORE_KEY = "lagezentrum.v1";
const TAB_KEY = "lagezentrum.tab";
const AREAS = ["Eingang", "Glaube", "Familie", "Beruf", "Training", "Finanzen", "Lernen", "Haushalt"];
const PRIO = { r: "Dringend", y: "Wichtig", b: "Normal" };
const LOC = { k: "Kassel", h: "Zuhause", a: "Egal" };
const WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const WD_LONG = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const MON_NATO = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

/* Luther 1912 (gemeinfrei) */
const VERSES = [

const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const wdIdx = d => (d.getDay() + 6) % 7; /* 0 = Montag */
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = d => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -wdIdx(d));
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return t.getUTCFullYear() + "-W" + pad(Math.ceil(((t - y0) / 864e5 + 1) / 7));
}
const fmtShort = s => { const d = parseISO(s); return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "."; };
function dtg(d) {
  const off = -d.getTimezoneOffset() / 60;
  const zone = off === 0 ? "Z" : off > 0 && off <= 9 ? "ABCDEFGHI"[off - 1] : off >= 10 && off <= 12 ? "KLM"[off - 10] : "J";
  return pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes()) + zone + " " + MON_NATO[d.getMonth()] + " " + String(d.getFullYear()).slice(2);
}

function normalize(s) {
  const e = emptyState();
  const out = Object.assign(e, s || {});
  out.settings = Object.assign(emptyState().settings, out.settings || {});
  out.review = Object.assign({ week: "", done: {} }, out.review || {});
  for (let i = 0; i < 7; i++) if (!Array.isArray(out.week[i])) out.week[i] = [];
  ["tasks", "habits", "goals", "pack"].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  out.habits.forEach(h => { if (!h.log || typeof h.log !== "object") h.log = {}; });
  out.goals.forEach(g => { if (!Array.isArray(g.ms)) g.ms = []; });
  return out;
}

function readLocal() {

function writeLocal(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }

/* ---------- Speicher: db (geräteübergreifend) mit lokalem Spiegel ---------- */
let docRef = null, writing = false, pending = false, saveTimer = null, downloads = null;

function prune() {
  const cutoff = iso(addDays(new Date(), -150));
  S.habits.forEach(h => { Object.keys(h.log).forEach(k => { if (k < cutoff) delete h.log[k]; }); });
  const doneCut = iso(addDays(new Date(), -60));
  S.tasks = S.tasks.filter(t => !t.done || !t.doneAt || t.doneAt >= doneCut);
  Object.keys(S.locOverride).forEach(k => { if (k < cutoff) delete S.locOverride[k]; });
}

function commit(msg) {
  S.updatedAt = Date.now();
  writeLocal(S);
  render();
  if (msg) toast(msg);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
async function flush() {
  if (!docRef) return;
  if (writing) { pending = true; return; }
  writing = true;
  try { prune(); await docRef.set(JSON.parse(JSON.stringify(S))); setSync(true); }
  catch (e) {
    if (e && e.code === "quota_exceeded") toast("Speicher voll – alte Einträge löschen");
    else if (e && e.code === "unavailable") { pending = true; }
    else setSync(false);
  }
  writing = false;
  if (pending) { pending = false; setTimeout(flush, 400 + Math.random() * 600); }
}

function setSync(on) {
  const el = $("#sync");
  el.classList.toggle("on", on);
  el.querySelector("span").textContent = on ? "Synchron" : "Nur dieses Gerät";
  el.title = on ? "Daten werden in deinem Konto gespeichert und auf allen Geräten abgeglichen" : "Daten liegen nur in diesem Browser";
}

async function connect() {
  setSync(false);
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    claude.use("downloads").then(d => { downloads = d; }).catch(() => {});
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    docRef = db.doc("data/users/" + id + "/state");
    let first = true;
    docRef.onSnapshot(snap => {
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (snap.exists) {
        const remote = normalize(snap.data());
        if ((remote.updatedAt || 0) > (S.updatedAt || 0)) { S = remote; writeLocal(S); render(); }
        else if (first && (S.updatedAt || 0) > (remote.updatedAt || 0)) flush();
      } else if (first && S.started) {
        flush();
      }
      first = false;
      setSync(true);
    }, () => { docRef = null; setSync(false); });
  } catch (e) { setSync(false); }
}

/* ---------- Ableitungen ---------- */
function locFor(dateStr) {
  if (S.locOverride[dateStr]) return S.locOverride[dateStr];
  return wdIdx(parseISO(dateStr)) < 5 ? "k" : "h";
}
const locName = l => l === "k" ? S.settings.base : l === "h" ? "Zuhause" : "Egal";
const prioRank = { r: 0, y: 1, b: 2 };

function rankedOpen() {
  const t = today(), here = locFor(t);
  return S.tasks.filter(x => !x.done).map(x => {
    let score = prioRank[x.prio] * 10;
    if (x.due && x.due < t) score -= 30;
    else if (x.due === t) score -= 20;
    else if (x.due && x.due <= iso(addDays(new Date(), 2))) score -= 6;
    if (x.loc !== "a" && x.loc !== here) score += 25;
    return { x, score };
  }).sort((a, b) => a.score - b.score || (a.x.due || "9") .localeCompare(b.x.due || "9") || (a.x.created || "").localeCompare(b.x.created || "")).map(o => o.x);
}

function habitApplies(h, dateStr) {
  const w = wdIdx(parseISO(dateStr));
  return h.days === "all" || (h.days === "wk" && w < 5) || (h.days === "we" && w >= 5);
}
function streak(h) {
  let d = new Date(), n = 0;
  if (!h.log[iso(d)]) d = addDays(d, -1);
  for (let i = 0; i < 400; i++) {
    const k = iso(d);
    if (habitApplies(h, k)) { if (h.log[k]) n++; else break; }
    d = addDays(d, -1);
  }
  return n;
}
const goalPct = g => g.ms.length ? Math.round(100 * g.ms.filter(m => m.done).length / g.ms.length) : 0;

function dueChip(due, done) {
  if (!due) return "";
  const t = today();
  if (done) return `<span class="chip">${fmtShort(due)}</span>`;
  if (due < t) return `<span class="chip r">Überfällig ${fmtShort(due)}</span>`;
  if (due === t) return `<span class="chip y">Heute</span>`;
  if (due === iso(addDays(new Date(), 1))) return `<span class="chip">Morgen</span>`;
  return `<span class="chip">${WD[wdIdx(parseISO(due))]} ${fmtShort(due)}</span>`;
}
function taskItem(x, opts = {}) {
  return `<li class="task ${x.done ? "done" : x.prio}">

}

      <ul class="checklist">${REVIEW.map(r => `<li class="${S.review.done[r[0]] ? "done" : ""}"><button class="check ${S.review.done[r[0]] ? "on" : ""}" data-act="toggle-review" data-id="${r[0]}" aria-label="${esc(r[1])}">${ICON.check}</button><span class="t">${esc(r[1])}</span><span></span></li>`).join("")}</ul>

function render() {
  const main = $("#main");

let toastT;
function toast(msg) {

/* ---------- Fokus-Timer ---------- */
let focusState = null, focusTick = null, wakeLock = null;
function openFocus(taskId) {
  const x = S.tasks.find(t => t.id === taskId);
  focusState = { label: x ? (x.next || x.t) : "Fokus", taskId, mins: 25, end: 0, left: 25 * 60, running: false };
  drawFocus();
}
function drawFocus() {
  const f = focusState; if (!f) { $("#layer").innerHTML = ""; return; }
  const m = Math.floor(f.left / 60), s = f.left % 60;
  $("#layer").innerHTML = `<div class="focus" role="dialog" aria-modal="true" aria-label="Fokus-Timer">
    <span class="eyebrow" style="color:inherit;opacity:.7">Fokus · Handy weg, eine Sache</span>
    <div class="what">${esc(f.label)}</div>
    <div class="clock" aria-live="off">${pad(m)}:${pad(s)}</div>
    ${f.running ? "" : `<div class="seg">${[10, 25, 45].map(n => `<button data-act="focus-mins" data-v="${n}" aria-pressed="${f.mins === n}">${n} Min</button>`).join("")}</div>`}
    <div class="row">
      <button class="btn" data-act="focus-run">${f.running ? "Pause" : f.left < f.mins * 60 ? "Weiter" : "Start"}</button>
      ${f.taskId ? `<button class="btn ghost" data-act="focus-done">Erledigt</button>` : ""}
      <button class="btn ghost" data-act="focus-close">Beenden</button>
    </div>
  </div>`;
}
async function setWake(on) {
  try {
    if (on && navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}
function focusRun() {
  const f = focusState;
  if (f.running) { f.running = false; f.left = Math.max(0, Math.round((f.end - Date.now()) / 1000)); clearInterval(focusTick); setWake(false); drawFocus(); return; }
  if (f.left <= 0) f.left = f.mins * 60;
  f.running = true; f.end = Date.now() + f.left * 1000; setWake(true);
  clearInterval(focusTick);
  focusTick = setInterval(() => {
    f.left = Math.max(0, Math.round((f.end - Date.now()) / 1000));
    const c = $(".focus .clock"); if (c) c.textContent = pad(Math.floor(f.left / 60)) + ":" + pad(f.left % 60);
    if (f.left <= 0) { clearInterval(focusTick); f.running = false; setWake(false); drawFocus(); toast("Zeit um. Kurz bewegen, Wasser trinken."); }
  }, 250);
  drawFocus();
}
function focusClose() { clearInterval(focusTick); setWake(false); focusState = null; drawFocus(); }

/* ---------- Aktionen ---------- */
const armed = new Map();
function armOrRun(btn, key, fn) {
  if (armed.get(key)) { armed.delete(key); fn(); return; }
  armed.set(key, true);
  btn.classList.add("armed"); btn.textContent = "Wirklich? Nochmal tippen";
  setTimeout(() => { armed.delete(key); if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = key === "wipe" ? "Alles löschen" : key === "starter" ? "Startpaket erneut laden" : "Löschen"; } }, 3500);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "close-sheet") { if (e.target === b || b.tagName === "BUTTON") closeSheet(); return; }
  const t = today();
  switch (act) {
    case "tab": setTab(b.dataset.tab); break;
    case "load-starter": S = starterState(); commit("Startpaket geladen"); break;
    case "start-empty": S.started = true; commit(); break;
    case "toggle-task": {
      const x = S.tasks.find(y => y.id === id); if (!x) return;
      x.done = !x.done; x.doneAt = x.done ? t : "";
      commit(x.done ? "Erledigt. Weiter so." : "Wieder offen");
      break;
    }
    case "edit-task": taskSheet(id); break;
    case "new-task": taskSheet(null); break;
    case "del-task": armOrRun(b, "task" + id, () => { S.tasks = S.tasks.filter(x => x.id !== id); closeSheet(); commit("Gelöscht"); }); break;
    case "filter": taskFilter = b.dataset.v; render(); break;
    case "toggle-habit": {
      const h = S.habits.find(y => y.id === id); if (!h) return;
      const day = b.dataset.day || t;
      if (h.log[day]) delete h.log[day]; else h.log[day] = 1;
      commit();
      break;
    }
    case "edit-habit": habitSheet(id); break;
    case "new-habit": habitSheet(null); break;
    case "del-habit": armOrRun(b, "habit" + id, () => { S.habits = S.habits.filter(x => x.id !== id); closeSheet(); commit("Gelöscht"); }); break;
    case "toggle-week-edit": editWeek = !editWeek; render(); break;
    case "toggle-loc": {
      const day = b.dataset.day, cur = locFor(day);
      const def = wdIdx(parseISO(day)) < 5 ? "k" : "h";
      const nxt = cur === "k" ? "h" : "k";
      if (nxt === def) delete S.locOverride[day]; else S.locOverride[day] = nxt;
      commit();
      break;
    }
    case "toggle-review": S.review.done[id] = !S.review.done[id]; commit(); break;
    case "toggle-pack": { const p = S.pack.find(x => x.id === id); if (p) { p.done = !p.done; commit(); } break; }
    case "del-pack": S.pack = S.pack.filter(x => x.id !== id); commit(); break;
    case "reset-pack": S.pack.forEach(p => p.done = false); commit("Packliste zurückgesetzt"); break;
    case "toggle-ms": { const g = S.goals.find(x => x.id === b.dataset.g); const m = g && g.ms.find(x => x.id === id); if (m) { m.done = !m.done; commit(m.done ? "Etappe erledigt" : null); keepOpen(g.id); } break; }
    case "del-ms": { const g = S.goals.find(x => x.id === b.dataset.g); if (g) { g.ms = g.ms.filter(x => x.id !== id); commit(); keepOpen(g.id); } break; }
    case "ms-to-task": {
      const g = S.goals.find(x => x.id === b.dataset.g); const m = g && g.ms.find(x => x.id === id); if (!m) return;
      S.tasks.push({ id: uid(), t: m.t, next: "", area: g.area, prio: "y", loc: "a", due: "", done: false, doneAt: "", created: t });
      commit("Als Aufgabe angelegt");
      break;
    }
    case "edit-goal": goalSheet(id); break;
    case "new-goal": goalSheet(null); break;
    case "del-goal": armOrRun(b, "goal" + id, () => { S.goals = S.goals.filter(x => x.id !== id); closeSheet(); commit("Gelöscht"); }); break;
    case "focus": openFocus(id); break;
    case "focus-mins": focusState.mins = +b.dataset.v; focusState.left = focusState.mins * 60; drawFocus(); break;
    case "focus-run": focusRun(); break;
    case "focus-done": { const x = S.tasks.find(y => y.id === focusState.taskId); if (x) { x.done = true; x.doneAt = t; } focusClose(); commit("Erledigt. Stark."); break; }
    case "focus-close": focusClose(); break;
    case "save-settings": {
      const v = ($("#s-base") && $("#s-base").value.trim()) || "Kassel";
      S.settings.base = v; closeSheet(); commit("Gespeichert");
      break;
    }
    case "export": {
      if (!downloads) return;
      downloads.save({ filename: "lagezentrum-sicherung-" + t + ".json", data: JSON.stringify(S, null, 2) })
        .then(r => { if (r && r.status === "saved") toast("Sicherung gespeichert"); })
        .catch(() => toast("Sicherung nicht gespeichert"));
      break;
    }
    case "load-starter-confirm": armOrRun(b, "starter", () => { S = starterState(); closeSheet(); commit("Startpaket geladen"); }); break;
    case "wipe": armOrRun(b, "wipe", () => { const base = S.settings.base; S = emptyState(); S.settings.base = base; closeSheet(); commit("Alles gelöscht"); }); break;
  }
});

function keepOpen(gid) {
  const f = document.querySelector(`[data-form="ms"][data-g="${gid}"]`);
  const d = f && f.closest("details"); if (d) d.open = true;
}

document.addEventListener("submit", e => {
  const f = e.target;
  if (f.id === "quick-form") {
    e.preventDefault();
    const inp = $("#quick-input"), v = inp.value.trim(); if (!v) return;
    S.tasks.push({ id: uid(), t: v, next: "", area: "Eingang", prio: "b", loc: "a", due: "", done: false, doneAt: "", created: today() });
    inp.value = ""; commit("Im Eingang abgelegt");
  } else if (f.dataset.form === "pack") {
    e.preventDefault();
    const inp = $("#pack-input"), v = inp.value.trim(); if (!v) return;
    S.pack.push({ id: uid(), t: v, done: false }); inp.value = ""; commit();
  } else if (f.dataset.form === "ms") {
    e.preventDefault();
    const g = S.goals.find(x => x.id === f.dataset.g), inp = f.querySelector("input"), v = inp.value.trim();
    if (!g || !v) return;
    g.ms.push({ id: uid(), t: v, done: false }); commit(); keepOpen(g.id);
  }
});

let weekTimer;
document.addEventListener("input", e => {
  const ta = e.target.closest("[data-week]");
  if (!ta) return;
  S.week[ta.dataset.week] = ta.value.split("\n").map(s => s.trim()).filter(Boolean);
  clearTimeout(weekTimer);
  weekTimer = setTimeout(() => { S.updatedAt = Date.now(); writeLocal(S); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); }, 600);
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (focusState) focusClose(); else closeSheet(); }
});
$("#btn-settings").addEventListener("click", settingsSheet);

/* ---------- Start ---------- */
tickDTG();
setInterval(tickDTG, 15000);
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
render();
connect();
})();
</script>
